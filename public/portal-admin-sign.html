<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign as Debtor & Guarantor · The Avenue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);--hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.30)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .admin-pill{background:rgba(212,162,74,0.18);color:var(--gold);border:1px solid rgba(212,162,74,0.45);padding:4px 10px;border-radius:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-left:8px}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .breadcrumb{padding:14px 32px;border-bottom:1px solid var(--hairline);font-size:13px;background:rgba(0,0,0,0.18)}
  .breadcrumb a{text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .body{max-width:1000px;margin:0 auto;padding:32px 32px 80px}
  .banner{background:rgba(212,162,74,0.10);border:1px solid rgba(212,162,74,0.4);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:13px;color:var(--cream);display:flex;gap:10px;align-items:flex-start}
  .banner svg{flex-shrink:0;width:18px;height:18px;margin-top:2px}
  h1{font-family:'Cormorant Garamond',serif;font-size:30px;color:white;margin:0 0 6px;font-weight:600}
  .h1-sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:24px;margin-bottom:24px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0 0 14px;font-weight:600}
  .terms-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px}
  .terms-row:last-child{border-bottom:0}
  .terms-row .lbl{color:var(--muted)}
  .terms-row .val{color:white;font-weight:500}
  .pdf-frame{width:100%;height:540px;background:var(--ink);border:1px solid var(--hairline);border-radius:10px;margin-bottom:18px}
  .pdf-frame iframe{width:100%;height:100%;border:0;border-radius:10px;display:block}
  .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--gold)}
  .field input.sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:14px 0 18px}
  .agree input{margin-top:3px}
  .sign-btn{width:100%;padding:16px;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .sign-btn:disabled{opacity:0.5;cursor:not-allowed}
  .sign-btn:hover:not(:disabled){background:var(--gold-hover);color:white}
  .err{color:#ff9a9a;font-size:13px;margin-top:10px;min-height:1.2em}
  .ok{color:#9FD6A8;font-size:13px;margin-top:10px}
  .denied{padding:60px 24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span><span class="admin-pill">Admin · Lukas</span></div>
    <div class="status">
      <span id="signedAs"><span class="status-dot"></span>Loading…</span>
      <a href="/api/portal/logout" class="signout">Sign out</a>
    </div>
  </div>
  <div id="bc"></div>
  <div class="body" id="body">
    <div style="text-align:center;color:var(--muted);padding:80px 20px">Loading…</div>
  </div>
<script>
  const LUKAS_EMAIL = 'bondysconstruction@gmail.com';
  function escape(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}
  function fmtMoney(n){const x=Number(n);return Number.isFinite(x)?x.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}):'—'}
  function fmtDate(iso){if(!iso)return '';return new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
  function firstName(n){return (n||'').split(' ')[0]}

  function fetchWithTimeout(url, opts = {}, ms = 9000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const email = (params.get('email')||'').toLowerCase().trim();
    if (!email) { document.getElementById('body').innerHTML='<div class="denied">No investor specified.</div>'; return; }

    let me;
    try {
      const meRes = await fetchWithTimeout('/api/portal/me', {}, 9000);
      if (meRes.status === 401) { window.location.href='/portal/sign-in'; return; }
      me = await meRes.json();
    } catch (err) {
      document.getElementById('body').innerHTML = '<div class="denied">Could not load. <a href="javascript:location.reload()" style="color:var(--gold)">Try again</a></div>';
      return;
    }
    document.getElementById('signedAs').innerHTML = '<span class="status-dot"></span>Signed in as ' + escape(me.name||'Admin');
    if (!me.ok || me.role !== 'admin' || (me.email||'').toLowerCase() !== LUKAS_EMAIL) {
      document.getElementById('body').innerHTML = '<div class="denied"><h1 style="font-size:24px">Only Lukas can sign here.</h1><p>If you\\'re Kevin, head back to the <a href="/portal/admin">admin dashboard</a>.</p></div>';
      return;
    }

    // Use roster endpoint for fast investor lookup (no Drive folder listing).
    let inv;
    try {
      const rosterRes = await fetchWithTimeout('/api/portal/roster', {}, 9000);
      const roster = await rosterRes.json();
      if (!roster.ok) throw new Error(roster.message || 'roster failed');
      inv = (roster.investors || []).find(i => (i.email||'').toLowerCase() === email);
      if (!inv) { document.getElementById('body').innerHTML = '<div class="denied">Investor not found: ' + escape(email) + '</div>'; return; }
    } catch (err) {
      document.getElementById('body').innerHTML = '<div class="denied">Could not load investor. <a href="javascript:location.reload()" style="color:var(--gold)">Try again</a></div>';
      return;
    }
    const blank = inv.blankPdfId ? { id: inv.blankPdfId, name: 'blank-promissory-note.pdf' } : null;

    document.getElementById('bc').innerHTML = `<div class="breadcrumb"><a href="/portal/admin">Roster</a><span style="color:var(--muted);margin:0 8px">/</span><a href="/portal/admin?email=${encodeURIComponent(email)}">${escape(inv.name)}</a><span style="color:var(--muted);margin:0 8px">/</span><span style="color:white">Sign</span></div>`;

    if (inv.lukasSignedAt) {
      document.getElementById('body').innerHTML = `<div class="denied"><h1 style="font-size:24px">Already signed.</h1><p>You signed this note on ${fmtDate(inv.lukasSignedAt)}. <a href="/portal/admin?email=${encodeURIComponent(email)}">Back to ${escape(inv.name)}'s folder</a>.</p></div>`;
      return;
    }

    document.getElementById('body').innerHTML = `
      <div class="banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>You're signing as <strong>Debtor (16740 E. Avenue of the Fountains, LLC)</strong> and <strong>Guarantor (Lukas Bondy, individually)</strong>. After you sign, ${escape(firstName(inv.name))} will be emailed a link to counter-sign as Creditor.</div>
      </div>

      <h1>Sign ${escape(firstName(inv.name))}'s note</h1>
      <p class="h1-sub">${escape(inv.email)} · ${fmtMoney(inv.principal)} · ${escape(inv.rate||'')} · ${escape(String(inv.termMonths||''))} months</p>

      <div class="card">
        <h2>Note terms</h2>
        <div class="terms-row"><span class="lbl">Creditor</span><span class="val">${escape(inv.name)}</span></div>
        <div class="terms-row"><span class="lbl">Principal</span><span class="val">${fmtMoney(inv.principal)}</span></div>
        <div class="terms-row"><span class="lbl">Interest rate</span><span class="val">${escape(inv.rate||'')}</span></div>
        <div class="terms-row"><span class="lbl">Term</span><span class="val">${escape(String(inv.termMonths||''))} months</span></div>
        <div class="terms-row"><span class="lbl">Minimum interest guarantee</span><span class="val">12 months</span></div>
      </div>

      <div class="card">
        <h2>Review the blank PDF</h2>
        ${blank ? `<div class="pdf-frame"><iframe src="https://drive.google.com/file/d/${blank.id}/preview" sandbox="allow-scripts allow-same-origin allow-popups"></iframe></div>` : '<p style="color:var(--muted);font-style:italic">No blank PDF uploaded yet.</p>'}
      </div>

      <div class="card">
        <h2>Sign</h2>
        <div class="sig-grid">
          <div class="field"><label>Signing as (Debtor)</label><input type="text" value="16740 E. Avenue of the Fountains, LLC — by Lukas Bondy, Member" disabled></div>
          <div class="field"><label>Signing as (Guarantor)</label><input type="text" value="Lukas Bondy, individually" disabled></div>
        </div>
        <div class="field"><label>Type your full legal name as signature</label><input type="text" id="typedSig" class="sig" placeholder="Lukas Bondy"></div>
        <label class="agree">
          <input type="checkbox" id="agreeBox">
          <span>I, Lukas Bondy, acknowledge that I am signing this Promissory Note in two capacities: (1) as authorized Member of 16740 E. Avenue of the Fountains, LLC ("Debtor"), and (2) as personal Guarantor of the Guaranteed Obligations. Typing my name above constitutes my legal electronic signature in both capacities.</span>
        </label>
        <button class="sign-btn" id="signBtn" disabled>Sign as Debtor &amp; Guarantor</button>
        <div class="err" id="errEl"></div>
        <div class="ok" id="okEl"></div>
      </div>
    `;

    const typed = document.getElementById('typedSig');
    const agree = document.getElementById('agreeBox');
    const btn = document.getElementById('signBtn');
    const errEl = document.getElementById('errEl');
    const okEl = document.getElementById('okEl');
    function update() {
      const match = (typed.value||'').trim().toLowerCase() === 'lukas bondy';
      btn.disabled = !(match && agree.checked);
    }
    typed.addEventListener('input', update);
    agree.addEventListener('change', update);
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent='Signing…'; errEl.textContent=''; okEl.textContent='';
      try {
        const res = await fetchWithTimeout('/api/portal/sign-as-lukas', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, typedSignature: typed.value.trim(), agreed: true })
        }, 30000);
        let d;
        try { d = await res.json(); }
        catch (parseErr) {
          errEl.textContent = 'Server error (HTTP ' + res.status + '). Reload and try again, or contact Kevin@AKCapital.fund.';
          btn.disabled = false; btn.textContent='Sign as Debtor & Guarantor';
          return;
        }
        if (d.ok) {
          okEl.textContent = '✓ Signed. ' + firstName(inv.name) + ' has been emailed to counter-sign.';
          setTimeout(()=>{ window.location.href='/portal/admin'; }, 1500);
        } else {
          errEl.textContent = (d.message || 'Could not sign.') + ' (HTTP ' + res.status + ')';
          btn.disabled = false; btn.textContent='Sign as Debtor & Guarantor';
        }
      } catch (err) {
        const isAbort = err && err.name === 'AbortError';
        errEl.textContent = isAbort
          ? 'Signing took too long. Try again — if it keeps failing, contact Kevin@AKCapital.fund.'
          : 'Network error: ' + (err && err.message ? err.message : 'unknown');
        btn.disabled = false; btn.textContent='Sign as Debtor & Guarantor';
      }
    });
  }
  init();
</script>
</body>
</html>
