<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · The Avenue Investor Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--teal:#2A6068;--cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);--hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.30)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .admin-pill{background:rgba(212,162,74,0.18);color:var(--gold);border:1px solid rgba(212,162,74,0.45);padding:4px 10px;border-radius:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-left:8px;font-family:'Inter',sans-serif}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3);padding-bottom:1px}

  .body{max-width:1200px;margin:0 auto;padding:32px 32px 80px}
  h1{font-family:'Cormorant Garamond',serif;font-size:32px;color:white;margin:0 0 6px;font-weight:600}
  .h1-sub{color:var(--muted);margin:0 0 28px;font-size:14px}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .summary-cell{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:12px;padding:18px 20px}
  .summary-cell .lbl{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .summary-cell .val{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);line-height:1}

  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:24px;margin-bottom:24px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .card-head h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0;font-weight:600}
  .add-btn{background:var(--gold);color:var(--ink);border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .add-btn:hover{background:var(--gold-hover);color:white}

  table.roster{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  table.roster th{text-align:left;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--hairline);font-weight:500}
  table.roster th.col-actions{text-align:right}
  table.roster td{padding:16px 12px;border-bottom:1px solid rgba(255,255,255,0.06);color:var(--text);vertical-align:middle}
  table.roster td.principal-cell{font-variant-numeric:tabular-nums;color:white}
  table.roster tr:last-child td{border-bottom:0}
  table.roster tr:hover{background:rgba(255,255,255,0.03)}
  .name-cell{display:flex;align-items:center;gap:12px;min-width:0}
  .name-text{min-width:0;overflow:hidden}
  .avatar{width:36px;height:36px;border-radius:50%;background:rgba(212,162,74,0.16);color:var(--gold);border:1px solid rgba(212,162,74,0.35);display:inline-flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;flex-shrink:0}
  .investor-name{color:white;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .investor-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:500;display:inline-block;white-space:nowrap;line-height:1.2}
  .badge.signed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .badge.pending-lukas{background:rgba(212,162,74,0.16);color:var(--gold)}
  .badge.pending-investor{background:rgba(255,215,138,0.12);color:#F0C56F}
  .badge.removed{background:rgba(255,154,154,0.10);color:#ff9a9a}
  .actions-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
  .row-btn{background:rgba(255,255,255,0.06);border:1px solid var(--hairline);color:var(--text);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;line-height:1;transition:border-color .15s ease,color .15s ease,background .15s ease}
  .row-btn:hover{border-color:var(--gold);color:var(--gold)}
  .row-btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
  .row-btn.primary:hover{background:var(--gold-hover);color:white;border-color:var(--gold-hover)}
  .row-btn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .row-btn.icon svg{width:15px;height:15px;display:block}
  .row-btn.danger:hover{border-color:#ff9a9a;color:#ff9a9a;background:rgba(255,154,154,0.06)}
  .row-btn:disabled,.add-btn:disabled,.cancel-btn:disabled{opacity:.45;cursor:wait}

  .add-form{background:rgba(0,0,0,0.22);border:1px dashed var(--gold);border-radius:12px;padding:22px;margin-top:14px;display:none}
  .add-form.open{display:block}
  .add-form h3{font-family:'Cormorant Garamond',serif;font-size:18px;color:white;margin:0 0 14px;font-weight:600}
  .add-grid{display:grid;grid-template-columns:1.2fr 1.4fr 0.9fr 0.9fr 0.9fr;gap:10px}
  .field label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--gold)}
  .file-zone{margin-top:12px;border:1.5px dashed var(--hairline);border-radius:10px;padding:18px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer}
  .file-zone:hover{border-color:var(--gold)}
  .file-zone.has-file{border-style:solid;border-color:var(--gold);background:rgba(212,162,74,0.06);color:white}
  .add-actions{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
  .cancel-btn{background:transparent;border:1px solid var(--hairline);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
  .err{color:#ff9a9a;font-size:13px;margin-top:10px;min-height:1.2em}

  /* Drill-down view */
  .breadcrumb{padding:14px 32px;border-bottom:1px solid var(--hairline);font-size:13px;background:rgba(0,0,0,0.18)}
  .breadcrumb a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .breadcrumb .sep{color:var(--muted);margin:0 8px}
  .admin-banner{background:rgba(212,162,74,0.10);border:1px solid rgba(212,162,74,0.4);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:13px;color:var(--cream);display:flex;gap:10px;align-items:center}
  .pdf-frame{width:100%;height:480px;background:var(--ink);border:1px solid var(--hairline);border-radius:10px}
  .pdf-frame iframe{width:100%;height:100%;border:0;border-radius:10px;display:block}
  .upload-zone{border:1.5px dashed var(--hairline);border-radius:12px;padding:24px;text-align:center;margin-bottom:20px;cursor:pointer}
  .upload-zone:hover{border-color:var(--gold)}
  .upload-zone.drag{border-color:var(--gold);background:rgba(212,162,74,0.06)}
  .upload-title{color:white;margin-bottom:4px}
  .upload-sub{color:var(--muted);font-size:12px}
  .doc-list{list-style:none;padding:0;margin:0}
  .doc-list li{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--hairline);border-radius:10px;margin-bottom:8px;font-size:14px}
  .doc-tag{width:36px;height:36px;background:rgba(212,162,74,0.15);color:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
  .doc-tag.signed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .doc-info{flex:1}
  .doc-name{color:white;text-decoration:none}
  .doc-name:hover{text-decoration:underline}
  .doc-meta{color:var(--muted);font-size:12px;margin-top:2px}

  .empty{color:var(--muted);text-align:center;padding:36px 20px;background:rgba(0,0,0,0.12);border:1px dashed var(--hairline);border-radius:12px}
  .empty-title{font-family:'Cormorant Garamond',serif;color:white;font-size:18px;margin-bottom:4px}
  .empty-sub{font-size:13px}
  .loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 20px;color:var(--muted)}
  .loader-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulseDot 1.2s ease-in-out infinite}
  @keyframes pulseDot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

  .dataroom-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px;font-weight:500;text-decoration:none;margin-right:14px}
  .dataroom-link:hover{background:rgba(218,165,32,0.08)}

  /* Walkthrough trigger + modal */
  .head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .walkthrough-trigger{background:transparent;border:1px solid var(--hairline);color:var(--muted);padding:9px 14px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;letter-spacing:0.02em;transition:border-color .15s ease,color .15s ease,background .15s ease}
  .walkthrough-trigger:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,162,74,0.05)}
  .wt-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;animation:wtFade .18s ease-out}
  @keyframes wtFade{from{opacity:0}to{opacity:1}}
  .wt-modal{background:var(--teal-deep);border:1px solid var(--hairline);border-radius:16px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.45);overflow:hidden}
  .wt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--hairline)}
  .wt-dots{display:flex;gap:6px;flex-wrap:wrap}
  .wt-dot{width:20px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);transition:background .2s ease;cursor:pointer;border:0;padding:0}
  .wt-dot.is-active{background:var(--gold)}
  .wt-dot.is-done{background:rgba(212,162,74,0.45)}
  .wt-meta{display:flex;align-items:center;gap:14px}
  .wt-counter{font-size:11px;color:var(--muted);letter-spacing:0.14em;text-transform:uppercase}
  .wt-close{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;font-family:inherit}
  .wt-close:hover{color:white;background:rgba(255,255,255,0.06)}
  .wt-body{padding:24px 26px;overflow-y:auto;flex:1}
  .wt-step{display:none}
  .wt-step.is-active{display:block;animation:wtSlide .25s ease-out}
  @keyframes wtSlide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .wt-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:white;margin:0 0 6px;font-weight:600}
  .wt-narr{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.55}
  .wt-narr strong{color:var(--text);font-weight:500}
  .wt-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-top:1px solid var(--hairline);background:rgba(0,0,0,0.18)}
  .wt-btn{background:rgba(255,255,255,0.06);border:1px solid var(--hairline);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .wt-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .wt-btn:disabled{opacity:.35;cursor:not-allowed}
  .wt-btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
  .wt-btn.primary:hover:not(:disabled){background:var(--gold-hover);color:white;border-color:var(--gold-hover)}
  .wt-btn.is-danger{background:#c45757;border-color:#c45757;color:white}
  .wt-btn.is-danger:hover:not(:disabled){background:#b14848;border-color:#b14848;color:white}
  .wt-mock{background:rgba(0,0,0,0.22);border:1px solid var(--hairline);border-radius:10px;padding:16px;font-size:13px}
  .wt-mock + .wt-mock{margin-top:10px}
  .wt-mock-label{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .wt-mock-form .wt-field{margin-bottom:10px}
  .wt-mock-form .wt-field-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .wt-mock-form .wt-field-val{background:rgba(0,0,0,0.3);border:1px solid var(--hairline);border-radius:6px;padding:7px 10px;color:white;font-size:12px}
  .wt-mock-form .wt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wt-mock-form .wt-drop{margin-top:6px;border:1.5px dashed var(--gold);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--gold);background:rgba(212,162,74,0.06)}
  .wt-em-from{font-size:11px;color:var(--muted);margin-bottom:6px}
  .wt-em-from strong{color:white;font-weight:500}
  .wt-em-subj{color:white;font-weight:600;font-size:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08)}
  .wt-em-body{color:var(--text);font-size:13px;line-height:1.55;margin-bottom:14px}
  .wt-em-body strong{color:white;font-weight:600}
  .wt-em-cta{display:inline-block;background:var(--gold);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600}
  .wt-em-attach{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid var(--hairline);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);margin-top:6px}
  .wt-em-tag{background:rgba(159,214,168,0.16);color:#9FD6A8;font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:0.06em}
  .wt-pdf{background:rgba(0,0,0,0.4);border:1px solid var(--hairline);border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:12px}
  .wt-sign-btn{display:inline-block;background:var(--gold);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600}
  .wt-mock-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .wt-arrow{color:var(--gold);font-size:14px}
  .wt-doc{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.22);border:1px solid var(--hairline);border-radius:8px;padding:10px 12px;font-size:12px}
  .wt-doc + .wt-doc{margin-top:6px}
  .wt-doc-tag{width:30px;height:30px;background:rgba(212,162,74,0.16);color:var(--gold);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
  .wt-doc-name{color:white;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wt-sign-row{margin-top:12px;display:flex;justify-content:flex-end}

  /* Toast + confirm dialog */
  body.modal-lock{overflow:hidden}
  .toast-stack{position:fixed;bottom:24px;right:24px;z-index:1100;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 48px)}
  .toast{background:var(--teal-deep);border:1px solid var(--hairline);border-radius:10px;padding:12px 16px;color:var(--text);font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,0.35);animation:toastIn .2s ease-out;pointer-events:auto;max-width:360px;line-height:1.45}
  .toast.is-out{animation:toastOut .3s forwards}
  .toast.toast-success{border-color:rgba(159,214,168,0.4);color:#9FD6A8}
  .toast.toast-error{border-color:rgba(255,154,154,0.45);color:#ff9a9a}
  @keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes toastOut{to{transform:translateY(10px);opacity:0}}
  .confirm-modal{background:var(--teal-deep);border:1px solid var(--hairline);border-radius:14px;max-width:440px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
  .confirm-modal h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0 0 8px;font-weight:600}
  .confirm-modal p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.55}
  .confirm-actions{display:flex;gap:8px;justify-content:flex-end}
  .upload-zone.is-busy{border-style:solid;border-color:var(--gold);background:rgba(212,162,74,0.08);cursor:wait}

  @media (max-width:880px){.summary{grid-template-columns:1fr 1fr}.add-grid{grid-template-columns:1fr 1fr}.brand-tag{display:none}.body{padding:24px 18px 60px}.header{padding:14px 18px}}

  /* Phone / small tablet: roster collapses from a table into card-per-investor */
  @media (max-width:720px){
    .body{padding:22px 14px 60px}
    h1{font-size:26px}
    .h1-sub{margin-bottom:20px}

    .summary{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .summary-cell{padding:14px}
    .summary-cell .lbl{font-size:10px;margin-bottom:4px}
    .summary-cell .val{font-size:22px}

    .card{padding:16px 14px;border-radius:12px;margin-bottom:18px}
    .card-head{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:14px}
    .card-head h2{font-size:20px}
    .head-actions{width:100%;display:flex;gap:8px;justify-content:stretch}
    .walkthrough-trigger{flex:1;padding:11px 12px;font-size:13px;text-align:center;color:var(--gold);border-color:rgba(212,162,74,0.45);background:rgba(212,162,74,0.06)}
    .add-btn{flex:1;padding:11px 14px;font-size:13px}

    table.roster{display:block;font-size:13px}
    table.roster colgroup,table.roster thead{display:none}
    table.roster tbody{display:block}
    table.roster tr{display:block;background:rgba(0,0,0,0.22);border:1px solid var(--hairline);border-radius:12px;padding:14px;margin-bottom:10px}
    table.roster tr:hover{background:rgba(0,0,0,0.22)}
    table.roster tr:last-child{margin-bottom:0}
    table.roster td{display:block;border-bottom:0;padding:0;width:auto}
    table.roster td:nth-child(1){margin-bottom:14px}
    table.roster td.principal-cell{display:inline-block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);line-height:1;margin-right:14px;vertical-align:middle}
    table.roster td:nth-child(3){display:inline-block;vertical-align:middle}
    table.roster td:nth-child(4){margin-top:14px}

    .actions-cell{justify-content:flex-start;gap:8px;flex-wrap:wrap}
    .row-btn{padding:10px 14px;font-size:13px;border-radius:8px}
    .row-btn.primary{flex:1;text-align:center;min-width:140px}
    .row-btn.icon{width:40px;height:40px;flex:0 0 auto;padding:0}
    .row-btn.icon svg{width:16px;height:16px}

    .name-cell{gap:10px}
    .avatar{width:38px;height:38px;font-size:13px}
    .investor-name{font-size:14px}
    .investor-sub{font-size:12px}

    .add-grid{grid-template-columns:1fr;gap:8px}
    .add-form{padding:16px;margin-top:12px}
    .add-form h3{font-size:16px;margin-bottom:12px}
    .file-zone{padding:14px;font-size:12px}
    .add-actions{flex-direction:column-reverse;gap:8px}
    .add-actions button{width:100%;padding:12px}

    .header{flex-wrap:wrap;gap:10px;padding:12px 14px}
    .brand{font-size:18px;flex:1;min-width:0}
    .admin-pill{padding:3px 7px;font-size:10px;margin-left:6px}
    .status{order:3;width:100%;justify-content:space-between;gap:10px;font-size:12px;padding-top:10px;border-top:1px solid var(--hairline)}

    .signout{flex-shrink:0}

    .breadcrumb{padding:12px 14px}
    .admin-banner{padding:12px 14px;font-size:12px;border-radius:10px}
    .pdf-frame{height:360px}
    .upload-zone{padding:18px}
    .doc-list li{padding:10px 12px;font-size:13px}

    .wt-backdrop{padding:12px}
    .wt-modal{max-height:92vh;border-radius:12px}
    .wt-head{padding:14px 16px}
    .wt-body{padding:18px}
    .wt-foot{padding:12px 16px}
    .wt-title{font-size:20px}
    .wt-mock-form .wt-grid{grid-template-columns:1fr}
    .toast-stack{bottom:14px;right:14px;left:14px;max-width:none}
    .toast{max-width:none}

  }

  @media (max-width:420px){
    .summary{grid-template-columns:1fr}
    .summary-cell .val{font-size:24px}
    h1{font-size:24px}
    .row-btn.primary{min-width:0;width:100%}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span><span class="admin-pill">Admin</span></div>
    <div class="status">
      <span id="signed-as"><span class="status-dot"></span>Loading…</span>
      <a href="/portal/enter-data-room" class="dataroom-link">View the data room →</a>
      <a href="/api/portal/logout" class="signout">Sign out</a>
    </div>
  </div>

  <div id="bcWrap"></div>
  <div class="body" id="body">
    <div class="loader"><span class="loader-dot"></span><span>Loading admin dashboard…</span></div>
  </div>

<script>
  const $body = document.getElementById('body');
  const $signedAs = document.getElementById('signed-as');
  const $bc = document.getElementById('bcWrap');
  const MAIL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  const TRASH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  const ROSTER_COLGROUP = '<colgroup><col style="width:38%"><col style="width:14%"><col style="width:22%"><col style="width:26%"></colgroup>';
  let me = null;
  let roster = null;

  function escape(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}

  function toast(msg, kind = 'info') {
    let stack = document.getElementById('toastStack');
    if (!stack) {
      stack = document.createElement('div');
      stack.id = 'toastStack';
      stack.className = 'toast-stack';
      stack.setAttribute('aria-live', 'polite');
      stack.setAttribute('aria-atomic', 'true');
      document.body.appendChild(stack);
    }
    const el = document.createElement('div');
    el.className = `toast toast-${kind}`;
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => el.classList.add('is-out'), 3500);
    setTimeout(() => el.remove(), 3900);
  }

  function confirmDialog({ title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
    return new Promise(resolve => {
      const root = document.createElement('div');
      root.className = 'wt-backdrop confirm-backdrop';
      root.innerHTML = `
        <div class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
          <h3 id="confirmTitle">${escape(title)}</h3>
          <p id="confirmMsg">${escape(message)}</p>
          <div class="confirm-actions">
            <button type="button" class="wt-btn" data-act="cancel">${escape(cancelLabel)}</button>
            <button type="button" class="wt-btn primary${danger ? ' is-danger' : ''}" data-act="confirm">${escape(confirmLabel)}</button>
          </div>
        </div>
      `;
      const previouslyFocused = document.activeElement;
      const cleanup = (val) => {
        document.removeEventListener('keydown', onKey);
        document.body.classList.remove('modal-lock');
        root.remove();
        try { previouslyFocused && previouslyFocused.focus && previouslyFocused.focus(); } catch {}
        resolve(val);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); cleanup(false); }
        else if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
      };
      document.addEventListener('keydown', onKey);
      document.body.classList.add('modal-lock');
      root.addEventListener('click', (e) => {
        if (e.target === root) return cleanup(false);
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'cancel') cleanup(false);
        else if (act === 'confirm') cleanup(true);
      });
      document.body.appendChild(root);
      root.querySelector('[data-act="confirm"]').focus();
    });
  }

  function resetAddForm() {
    const form = document.getElementById('addInvestor');
    if (form) form.reset();
    const err = document.getElementById('addErr');
    if (err) err.textContent = '';
  }
  function fmtMoney(n){const x=Number(n);return Number.isFinite(x)?x.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}):'—'}
  function fmtDate(iso){if(!iso)return '';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
  function fileExt(name){const m=(name||'').match(/\.([^.]+)$/);return m?m[1].toUpperCase():''}
  function initials(name){return (name||'').split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase()}
  function firstName(n){return (n||'').split(' ')[0]}

  function getSelectedEmail() {
    const p = new URLSearchParams(window.location.search);
    return (p.get('email') || '').toLowerCase().trim();
  }

  async function loadRoster() {
    const res = await fetch('/api/portal/roster');
    if (res.status === 401) { window.location.href = '/'; return; }
    return res.json();
  }

  async function init() {
    const data = await loadRoster();
    if (!data || !data.ok) {
      $body.innerHTML = '<div style="color:#ff9a9a;padding:80px 20px;text-align:center">' + escape((data && data.message)||'Could not load admin.') + '</div>';
      return;
    }
    roster = data;
    try {
      const meRes = await fetch('/api/portal/me');
      if (meRes.ok) me = await meRes.json();
    } catch {}
    if (!me) me = { name: 'Admin', email: '' };
    $signedAs.innerHTML = '<span class="status-dot"></span>Signed in as ' + escape(me.name || 'Admin');

    const drillEmail = getSelectedEmail();
    if (drillEmail) {
      renderDrillDown(drillEmail);
    } else {
      renderRoster();
    }
  }

  function renderRoster() {
    $bc.innerHTML = '';
    const investors = (roster.investors || []).filter(i => !i.deletedAt);
    const removed = (roster.investors || []).filter(i => i.deletedAt);
    const totalCommit = investors.reduce((s, i) => s + (Number(i.principal)||0) + (Number(i.equityAmount)||0), 0);
    const numActive = investors.filter(i => i.state === 'active').length;
    const numInvited = investors.filter(i => i.state === 'invited').length;

    $body.innerHTML = `
      <h1>Investor roster</h1>
      <p class="h1-sub">All committed investors, their position, and their personal folder.</p>
      <div class="summary">
        <div class="summary-cell"><div class="lbl">Investors</div><div class="val">${investors.length}</div></div>
        <div class="summary-cell"><div class="lbl">Active</div><div class="val">${numActive}</div></div>
        <div class="summary-cell"><div class="lbl">Invited</div><div class="val">${numInvited}</div></div>
        <div class="summary-cell"><div class="lbl">Committed capital</div><div class="val">${fmtMoney(totalCommit)}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>All investors</h2>
          <div class="head-actions">
            <button class="add-btn" id="addToggle" type="button">+ Add investor</button>
          </div>
        </div>

        ${investors.length === 0 ? `<div class="empty"><div class="empty-title">No investors yet</div><div class="empty-sub">Click <strong style="color:var(--gold)">+ Add investor</strong> above to add your first one.</div></div>` : `
        <table class="roster">
          ${ROSTER_COLGROUP}
          <thead><tr>
            <th>Name</th>
            <th>Position</th>
            <th>Status</th>
            <th class="col-actions">Actions</th>
          </tr></thead>
          <tbody>
            ${investors.map(rowHtml).join('')}
          </tbody>
        </table>
        `}

        <div class="add-form" id="addForm">
          <h3>+ Add new investor</h3>
          <form id="addInvestor">
            <div class="add-grid" style="grid-template-columns:1fr 1fr">
              <div class="field"><label>Full legal name</label><input type="text" name="name" required placeholder="Jane Doe"></div>
              <div class="field"><label>Email</label><input type="email" name="email" required placeholder="jane@example.com"></div>
            </div>
            <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px">Interest (debt) — optional</div>
            <div class="add-grid" style="grid-template-columns:1fr 1fr 1fr">
              <div class="field"><label>Principal ($)</label><input type="number" name="principal" placeholder="125000"></div>
              <div class="field"><label>Rate (%/yr)</label><input type="text" name="rate" value="20% per annum"></div>
              <div class="field"><label>Term (months)</label><input type="number" name="termMonths" value="20"></div>
            </div>
            <div style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px">Equity — optional</div>
            <div class="add-grid" style="grid-template-columns:1fr 1fr">
              <div class="field"><label>Equity amount ($)</label><input type="number" name="equityAmount" placeholder="100000"></div>
              <div class="field"><label>Ownership (%)</label><input type="number" step="0.01" name="ownershipPct" placeholder="5"></div>
            </div>
            <p style="color:var(--muted);font-size:12px;margin:12px 0 0">Fill interest, equity, or both. We'll create their folder and email a portal invite. Terms are shown to them as read-only info.</p>
            <div class="add-actions">
              <button type="button" class="cancel-btn" id="cancelAdd">Cancel</button>
              <button type="submit" class="add-btn">Create investor &amp; send invite</button>
            </div>
            <div class="err" id="addErr"></div>
          </form>
        </div>
      </div>

      <div id="updatesAdmin"></div>
      <div id="inboxAdmin"></div>

      ${removed.length ? `
      <div class="card" style="opacity:.7">
        <div class="card-head"><h2>Removed</h2></div>
        <table class="roster">
          ${ROSTER_COLGROUP}
          <tbody>
            ${removed.map(rowHtml).join('')}
          </tbody>
        </table>
      </div>` : ''}
    `;

    document.getElementById('addToggle').addEventListener('click', () => {
      document.getElementById('addForm').classList.toggle('open');
    });
    document.getElementById('cancelAdd').addEventListener('click', () => {
      resetAddForm();
      document.getElementById('addForm').classList.remove('open');
    });
    document.getElementById('addInvestor').addEventListener('submit', addInvestor);

    document.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', () => rowAction(el.dataset.act, el.dataset.email, el));
    });

    loadUpdatesAdmin();
    loadInbox();
  }

  // ---------- Updates (admin) ----------
  async function loadUpdatesAdmin() {
    const host = document.getElementById('updatesAdmin');
    if (!host) return;
    const investors = (roster.investors || []).filter(i => !i.deletedAt);
    let updates = [];
    try {
      const r = await fetch('/api/portal/updates');
      if (r.ok) { const d = await r.json(); updates = (d && d.updates) || []; }
    } catch {}
    const audienceName = (a) => {
      if (a === 'all') return 'Everyone';
      const inv = investors.find(i => (i.email||'').toLowerCase() === (a||'').toLowerCase());
      return inv ? inv.name : a;
    };
    host.innerHTML = `<div class="card">
      <div class="card-head">
        <h2>Updates</h2>
        <button class="add-btn" id="updToggle" type="button">+ Post update</button>
      </div>
      <div class="add-form" id="updForm">
        <h3>+ Post an update</h3>
        <div class="field" style="margin-bottom:10px"><label>Title</label><input type="text" id="updTitle" placeholder="June construction update"></div>
        <div class="field" style="margin-bottom:10px"><label>Message</label><textarea id="updBody" rows="4" style="width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical" placeholder="Share progress, milestones, or news…"></textarea></div>
        <div class="field" style="margin-bottom:10px"><label>Audience</label>
          <select id="updAudience" style="width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit">
            <option value="all">Everyone</option>
            ${investors.map(i => `<option value="${escape(i.email)}">${escape(i.name)} (${escape(i.email)})</option>`).join('')}
          </select>
        </div>
        <div class="add-actions">
          <button type="button" class="cancel-btn" id="updCancel">Cancel</button>
          <button type="button" class="add-btn" id="updPost">Post &amp; notify</button>
        </div>
        <div class="err" id="updErr"></div>
      </div>
      ${updates.length ? `<ul class="doc-list" style="margin-top:14px">${updates.map(u => `
        <li>
          <div class="doc-info">
            <div class="doc-name" style="color:white">${escape(u.title || 'Update')} <span class="badge ${u.audience==='all'?'signed':'pending-investor'}" style="margin-left:6px">${escape(audienceName(u.audience))}</span></div>
            <div class="doc-meta">${fmtDate(u.createdAt)}${u.body ? ' · ' + escape(u.body.slice(0,80)) + (u.body.length>80?'…':'') : ''}</div>
          </div>
          <button class="row-btn icon danger" data-upd-del="${escape(u.id)}" title="Delete update" aria-label="Delete update">${TRASH_ICON}</button>
        </li>`).join('')}</ul>` : '<p style="color:var(--muted);font-size:13px;margin:14px 0 0">No updates posted yet.</p>'}
    </div>`;

    document.getElementById('updToggle').addEventListener('click', () => document.getElementById('updForm').classList.toggle('open'));
    document.getElementById('updCancel').addEventListener('click', () => document.getElementById('updForm').classList.remove('open'));
    document.getElementById('updPost').addEventListener('click', postUpdate);
    host.querySelectorAll('[data-upd-del]').forEach(b => b.addEventListener('click', () => deleteUpdate(b.dataset.updDel)));
  }

  async function postUpdate() {
    const errEl = document.getElementById('updErr'); errEl.textContent = '';
    const title = document.getElementById('updTitle').value.trim();
    const body = document.getElementById('updBody').value.trim();
    const audience = document.getElementById('updAudience').value;
    if (!title && !body) { errEl.textContent = 'Add a title or message.'; return; }
    const btn = document.getElementById('updPost');
    btn.disabled = true; btn.textContent = 'Posting…';
    try {
      const res = await fetch('/api/portal/updates', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title, body, audience })
      });
      const data = await res.json();
      if (data.ok) { toast('Update posted and investors notified.', 'success'); loadUpdatesAdmin(); }
      else { errEl.textContent = data.message || 'Could not post.'; }
    } catch { errEl.textContent = 'Network error. Try again.'; }
    finally { btn.disabled = false; btn.textContent = 'Post & notify'; }
  }

  async function deleteUpdate(id) {
    const ok = await confirmDialog({ title: 'Delete update?', message: 'Investors will no longer see this update.', confirmLabel: 'Delete', danger: true });
    if (!ok) return;
    try {
      const res = await fetch('/api/portal/updates/delete', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id })
      });
      const data = await res.json();
      if (data.ok) { toast('Update deleted.', 'success'); loadUpdatesAdmin(); }
      else toast(data.message || 'Could not delete.', 'error');
    } catch { toast('Network error. Try again.', 'error'); }
  }

  // ---------- Messages inbox (admin) ----------
  async function loadInbox() {
    const host = document.getElementById('inboxAdmin');
    if (!host) return;
    let threads = [];
    try {
      const r = await fetch('/api/portal/messages');
      if (r.ok) { const d = await r.json(); threads = (d && d.threads) || []; }
    } catch {}
    host.innerHTML = `<div class="card">
      <div class="card-head">
        <h2>Messages</h2>
        <button class="add-btn" id="broadcastToggle" type="button">✉ Message everyone</button>
      </div>
      <div class="add-form" id="broadcastForm">
        <h3>Message all active investors</h3>
        <p style="color:var(--muted);font-size:12px;margin:0 0 10px">Goes into every active investor's conversation and emails each of them. They can reply to you privately.</p>
        <textarea id="broadcastBody" rows="4" style="width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical" placeholder="Write a message to all investors…"></textarea>
        <div class="add-actions">
          <button type="button" class="cancel-btn" id="broadcastCancel">Cancel</button>
          <button type="button" class="add-btn" id="broadcastSend">Send to everyone</button>
        </div>
        <div class="err" id="broadcastErr"></div>
      </div>
      ${threads.length ? `<ul class="doc-list" style="margin-top:14px">${threads.map(t => `
        <li style="cursor:pointer" data-msg-open="${escape(t.email)}">
          <div class="avatar">${escape(initials(t.name || t.email))}</div>
          <div class="doc-info">
            <div class="doc-name" style="color:white">${escape(t.name || t.email)} ${t.unreadFromInvestor ? `<span class="badge pending-investor" style="margin-left:6px">${t.unreadFromInvestor} new</span>` : ''}</div>
            <div class="doc-meta">${t.lastFrom === 'admin' ? 'You: ' : ''}${escape(t.lastSnippet || '')} · ${fmtDate(t.lastMessageAt)}</div>
          </div>
          <span style="color:var(--gold)">Open →</span>
        </li>`).join('')}</ul>` : '<p style="color:var(--muted);font-size:13px;margin:14px 0 0">No conversations yet. Use “Message everyone” above, or open an investor to start one.</p>'}
    </div>`;
    host.querySelectorAll('[data-msg-open]').forEach(li => li.addEventListener('click', () => {
      window.location.search = '?email=' + encodeURIComponent(li.dataset.msgOpen);
    }));
    document.getElementById('broadcastToggle').addEventListener('click', () => document.getElementById('broadcastForm').classList.toggle('open'));
    document.getElementById('broadcastCancel').addEventListener('click', () => document.getElementById('broadcastForm').classList.remove('open'));
    document.getElementById('broadcastSend').addEventListener('click', sendBroadcast);
  }

  async function sendBroadcast() {
    const errEl = document.getElementById('broadcastErr'); errEl.textContent = '';
    const body = document.getElementById('broadcastBody').value.trim();
    if (!body) { errEl.textContent = 'Write a message first.'; return; }
    const ok = await confirmDialog({
      title: 'Message all investors?',
      message: 'This sends the message to every active investor and emails each of them.',
      confirmLabel: 'Send to everyone'
    });
    if (!ok) return;
    const btn = document.getElementById('broadcastSend');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const res = await fetch('/api/portal/messages/broadcast', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ body })
      });
      const data = await res.json();
      if (data.ok) { toast(`Message sent to ${data.count} investor${data.count===1?'':'s'}.`, 'success'); loadInbox(); }
      else { errEl.textContent = data.message || 'Could not send.'; btn.disabled = false; btn.textContent = 'Send to everyone'; }
    } catch { errEl.textContent = 'Network error. Try again.'; btn.disabled = false; btn.textContent = 'Send to everyone'; }
  }

  function rowHtml(inv) {
    const badge =
      inv.deletedAt ? `<span class="badge removed">Removed</span>` :
      inv.state === 'active' ? `<span class="badge signed">● Active</span>` :
      `<span class="badge pending-investor">Invited</span>`;
    const principal = Number(inv.principal) || 0;
    const equity = Number(inv.equityAmount) || 0;
    const pct = Number(inv.ownershipPct) || 0;
    const total = principal + equity;
    const parts = [];
    if (principal > 0) parts.push('Interest');
    if (equity > 0 || pct > 0) parts.push('Equity' + (pct > 0 ? ` ${inv.ownershipPct}%` : ''));
    const positionMain = total > 0 ? fmtMoney(total) : (pct > 0 ? `${inv.ownershipPct}%` : '—');
    const positionSub = parts.join(' + ');
    return `<tr>
      <td>
        <div class="name-cell">
          <div class="avatar">${escape(initials(inv.name))}</div>
          <div class="name-text">
            <div class="investor-name">${escape(inv.name)}</div>
            <div class="investor-sub">${escape(inv.email)}</div>
          </div>
        </div>
      </td>
      <td class="principal-cell">${positionMain}${positionSub ? `<div style="font-size:11px;color:var(--muted);font-variant-numeric:normal;margin-top:2px">${positionSub}</div>` : ''}</td>
      <td>${badge}</td>
      <td>
        <div class="actions-cell">
          ${inv.deletedAt ? '' : `<button class="row-btn primary" data-act="open" data-email="${escape(inv.email)}">Open folder →</button>`}
          ${inv.deletedAt ? '' : `<button class="row-btn" data-act="link" data-email="${escape(inv.email)}" title="Get a sign-in link">${inv.state === 'active' ? 'Reset link' : 'Sign-in link'}</button>`}
          ${inv.deletedAt ? '' : `<button class="row-btn icon" data-act="resend" data-email="${escape(inv.email)}" title="Email the sign-in link" aria-label="Email the sign-in link">${MAIL_ICON}</button>`}
          ${inv.deletedAt ? '' : `<button class="row-btn icon danger" data-act="remove" data-email="${escape(inv.email)}" title="Remove investor" aria-label="Remove investor">${TRASH_ICON}</button>`}
        </div>
      </td>
    </tr>`;
  }

  function rowAction(act, email, btn) {
    if (act === 'open') { window.location.search = '?email=' + encodeURIComponent(email); return; }
    if (act === 'link') return getInviteLink(email, btn);
    if (act === 'resend') return resendLink(email, btn);
    if (act === 'remove') return removeInvestor(email, btn);
  }

  // Fetch a ready-to-use sign-in link for an investor and show it (copies to
  // clipboard too). Works even when invite emails aren't being delivered.
  async function getInviteLink(email, btn) {
    if (btn) { btn.disabled = true; }
    try {
      const res = await fetch('/api/portal/invite-link', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!data.ok) { toast(data.message || 'Could not get link.', 'error'); return; }
      try { await navigator.clipboard.writeText(data.url); toast('Sign-in link copied to clipboard.', 'success'); } catch {}
      showLinkDialog(data);
    } catch { toast('Network error. Try again.', 'error'); }
    finally { if (btn) btn.disabled = false; }
  }

  function showLinkDialog(data) {
    const root = document.createElement('div');
    root.className = 'wt-backdrop';
    root.innerHTML = `
      <div class="confirm-modal" role="dialog" aria-modal="true" style="max-width:520px">
        <h3>${escape(data.name || data.email)}'s sign-in link</h3>
        <p>${data.kind === 'setup'
          ? 'Open this to set their password and enter the portal — or send it to them directly. It only needs to be used once.'
          : 'This is a fresh password-reset link (their old link no longer works). Open it to set a new password.'}</p>
        <input readonly value="${escape(data.url)}" onclick="this.select()" style="width:100%;padding:11px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:12px;font-family:monospace;margin-bottom:18px">
        <div class="confirm-actions">
          <button type="button" class="wt-btn" data-act="copy">Copy link</button>
          <a class="wt-btn primary" href="${escape(data.url)}" target="_blank" rel="noopener">Open it now →</a>
        </div>
      </div>`;
    document.body.appendChild(root);
    document.body.classList.add('modal-lock');
    const close = () => { document.body.classList.remove('modal-lock'); root.remove(); };
    root.addEventListener('click', (e) => {
      if (e.target === root) return close();
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'copy') { navigator.clipboard.writeText(data.url).then(() => toast('Copied.', 'success')).catch(() => {}); }
    });
    const field = root.querySelector('input'); if (field) { field.focus(); field.select(); }
  }

  async function addInvestor(e) {
    e.preventDefault();
    const errEl = document.getElementById('addErr'); errEl.textContent = '';
    const form = e.currentTarget;
    const fd = new FormData(form);
    const payload = {
      name: fd.get('name'), email: fd.get('email'),
      principal: fd.get('principal'), rate: fd.get('rate'), termMonths: fd.get('termMonths'),
      equityAmount: fd.get('equityAmount'), ownershipPct: fd.get('ownershipPct')
    };
    const btn = form.querySelector('button[type=submit]');
    const restore = () => { btn.disabled = false; btn.textContent = 'Create investor & send invite'; };
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const res = await fetch('/api/portal/add-investor', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.ok) {
        toast(data.invited ? 'Investor added — invite emailed.' : 'Investor added. Invite email failed; use the resend button.', data.invited ? 'success' : 'error');
        const r = await loadRoster(); roster = r;
        renderRoster();
      } else {
        errEl.textContent = data.message || 'Could not create.';
        restore();
      }
    } catch (err) {
      errEl.textContent = 'Network error. Try again.';
      restore();
    }
  }

  async function resendLink(email, btn) {
    const ok = await confirmDialog({
      title: 'Resend sign-in link?',
      message: `A fresh sign-in link will be emailed to ${email}.`,
      confirmLabel: 'Send link'
    });
    if (!ok) return;
    if (btn) btn.disabled = true;
    try {
      const res = await fetch('/api/portal/resend-link', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, kind: 'setup' })
      });
      const data = await res.json();
      if (data.ok) toast('Sign-in link emailed.', 'success');
      else toast(data.message || 'Could not send link.', 'error');
    } catch {
      toast('Network error. Try again.', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function removeInvestor(email, btn) {
    const ok = await confirmDialog({
      title: 'Remove investor?',
      message: `${email} will lose portal access. Their Drive folder and any signed PDFs are kept.`,
      confirmLabel: 'Remove',
      danger: true
    });
    if (!ok) return;
    if (btn) btn.disabled = true;
    try {
      const res = await fetch('/api/portal/remove-investor', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.ok) {
        toast('Investor removed.', 'success');
        const r = await loadRoster(); roster = r; renderRoster();
      } else {
        toast(data.message || 'Could not remove investor.', 'error');
        if (btn) btn.disabled = false;
      }
    } catch {
      toast('Network error. Try again.', 'error');
      if (btn) btn.disabled = false;
    }
  }

  // ---------- Drill-down ----------
  async function renderDrillDown(email) {
    $bc.innerHTML = `<div class="breadcrumb"><a href="/portal/admin">Investor roster</a><span class="sep">/</span><span style="color:white" id="bcName">${escape(email)}</span></div>`;
    let res;
    try {
      res = await fetch('/api/portal/folder?email=' + encodeURIComponent(email));
    } catch { $body.innerHTML = '<div class="empty">Network error.</div>'; return; }
    if (res.status === 401) { window.location.href='/'; return; }
    const data = await res.json();
    if (!data.ok) { $body.innerHTML = '<div class="empty">' + escape(data.message||'Not found.') + '</div>'; return; }
    const inv = data.investor;
    document.getElementById('bcName').textContent = inv.name;
    const files = data.files || [];
    const stateLabel =
      inv.status === 'active' ? `<span style="color:#9FD6A8">● Active</span>` :
      `<span style="color:var(--gold)">Invited — awaiting first sign-in</span>`;

    const hasDebt = Number(inv.principal) > 0;
    const hasEquity = Number(inv.equityAmount) > 0 || Number(inv.ownershipPct) > 0;
    const invRow = (lbl, val, last) => `<div style="display:flex;justify-content:space-between;padding:10px 0;${last ? '' : 'border-bottom:1px solid rgba(255,255,255,0.08)'}"><span style="color:var(--muted)">${lbl}</span><span style="color:white">${val}</span></div>`;
    let invRows = '';
    if (hasDebt) {
      invRows += invRow(hasEquity ? 'Interest principal' : 'Principal', fmtMoney(inv.principal));
      invRows += invRow('Interest rate', escape(inv.rate || ''));
      invRows += invRow('Term', escape(String(inv.termMonths || '')) + ' months');
    }
    if (hasEquity) {
      if (Number(inv.equityAmount) > 0) invRows += invRow('Equity investment', fmtMoney(inv.equityAmount));
      if (Number(inv.ownershipPct) > 0) invRows += invRow('Ownership', escape(String(inv.ownershipPct)) + '%');
    }
    invRows += invRow('Status', stateLabel, true);
    const subAmounts = [];
    if (hasDebt) subAmounts.push(fmtMoney(inv.principal) + ' interest');
    if (Number(inv.equityAmount) > 0) subAmounts.push(fmtMoney(inv.equityAmount) + ' equity');
    if (Number(inv.ownershipPct) > 0) subAmounts.push(escape(String(inv.ownershipPct)) + '% ownership');

    $body.innerHTML = `
      <div class="admin-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        You're viewing this folder as an admin. Uploads you make here will be saved to <strong>${escape(inv.name)}</strong>'s Drive folder.
      </div>

      <h1>${escape(firstName(inv.name))}'s <em style="font-family:inherit;color:var(--gold);font-style:normal">documents</em></h1>
      <p class="h1-sub">${escape(inv.email)}${subAmounts.length ? ' · ' + subAmounts.join(' · ') : ''}</p>

      <div class="card">
        <div class="card-head"><h2>Investment</h2></div>
        <div style="font-size:14px">${invRows}</div>
      </div>

      <div class="card">
        <div class="card-head"><h2>All documents</h2></div>
        <p style="color:var(--muted);font-size:13px;margin:-8px 0 14px">Drop files to add to ${escape(inv.name)}'s folder. They'll see them next sign-in.</p>
        <form id="adminUploadForm">
          <label class="upload-zone" id="adminUploadZone" for="adminUploadInput">
            <div class="upload-title">Upload to ${escape(inv.name)}'s folder</div>
            <div class="upload-sub">25 MB per file</div>
          </label>
          <input type="file" id="adminUploadInput" multiple style="display:none">
        </form>
        <div class="err" id="adminUpErr"></div>
        <ul class="doc-list" id="adminDocList"></ul>
      </div>

      <div id="threadAdmin"></div>
    `;
    renderDocList(files);
    wireAdminUpload(inv.email);
    loadThreadAdmin(inv.email, inv.name);
  }

  // ---------- Message thread (admin drill-down) ----------
  async function loadThreadAdmin(email, name) {
    const host = document.getElementById('threadAdmin');
    if (!host) return;
    let messages = [];
    try {
      const r = await fetch('/api/portal/messages?email=' + encodeURIComponent(email));
      if (r.ok) { const d = await r.json(); messages = (d && d.messages) || []; }
    } catch {}
    host.innerHTML = `<div class="card">
      <div class="card-head"><h2>Messages with ${escape(firstName(name||email))}</h2></div>
      <div id="adminThread" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">${renderAdminThread(messages)}</div>
      <form id="adminMsgForm" style="display:flex;gap:10px;align-items:flex-end">
        <textarea id="adminMsgInput" rows="2" placeholder="Reply to ${escape(firstName(name||email))}…" style="flex:1;padding:11px 13px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical"></textarea>
        <button type="submit" class="add-btn" id="adminMsgSend" style="padding:12px 20px">Send</button>
      </form>
      <div class="err" id="adminMsgErr"></div>
    </div>`;
    const form = document.getElementById('adminMsgForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('adminMsgInput');
      const errEl = document.getElementById('adminMsgErr');
      const btn = document.getElementById('adminMsgSend');
      const body = (input.value || '').trim();
      errEl.textContent = '';
      if (!body) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/portal/messages', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, body })
        });
        const data = await res.json();
        if (data.ok) { input.value = ''; loadThreadAdmin(email, name); }
        else errEl.textContent = data.message || 'Could not send.';
      } catch { errEl.textContent = 'Network error. Try again.'; }
      finally { btn.disabled = false; btn.textContent = 'Send'; }
    });
  }

  function renderAdminThread(messages) {
    if (!messages.length) return '<div style="color:var(--muted);font-style:italic;font-size:13px">No messages yet.</div>';
    return messages.map(m => {
      const mine = m.from === 'admin';
      const align = mine ? 'flex-end' : 'flex-start';
      const bg = mine ? 'rgba(212,162,74,0.16)' : 'rgba(255,255,255,0.06)';
      const who = mine ? 'You' : 'Investor';
      return `<div style="align-self:${align};max-width:80%">
        <div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-align:${mine?'right':'left'}">${who} · ${fmtDate(m.createdAt)}</div>
        <div style="background:${bg};border:1px solid var(--hairline);border-radius:12px;padding:10px 13px;font-size:14px;white-space:pre-wrap">${escape(m.body)}</div>
      </div>`;
    }).join('');
  }

  function renderDocList(files) {
    const list = document.getElementById('adminDocList');
    if (!list) return;
    if (!files.length) { list.innerHTML = '<li class="empty">No documents yet.</li>'; return; }
    list.innerHTML = files.map(f => {
      const ext = fileExt(f.name);
      return `<li>
        <span class="doc-tag">${escape(ext||'FILE')}</span>
        <div class="doc-info">
          <a class="doc-name" href="${escape(f.url)}" target="_blank" rel="noopener">${escape(f.name)}</a>
          <div class="doc-meta">${fmtDate(f.createdTime)}</div>
        </div>
      </li>`;
    }).join('');
  }

  function wireAdminUpload(email) {
    const zone = document.getElementById('adminUploadZone');
    const input = document.getElementById('adminUploadInput');
    const errEl = document.getElementById('adminUpErr');
    let dragDepth = 0;
    let busy = false;

    zone.addEventListener('dragenter', e => {
      e.preventDefault();
      if (busy) return;
      dragDepth++;
      zone.classList.add('drag');
    });
    zone.addEventListener('dragover', e => { e.preventDefault(); });
    zone.addEventListener('dragleave', e => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) zone.classList.remove('drag');
    });
    zone.addEventListener('drop', e => {
      e.preventDefault();
      dragDepth = 0;
      zone.classList.remove('drag');
      if (busy) return;
      doUpload(e.dataTransfer.files);
    });
    input.addEventListener('change', () => doUpload(input.files));

    async function doUpload(filesLike) {
      const files = Array.from(filesLike || []);
      if (!files.length || busy) return;
      busy = true;
      errEl.textContent = '';
      zone.classList.add('is-busy');
      const total = files.length;
      const titleEl = zone.querySelector('.upload-title');
      const originalTitle = titleEl ? titleEl.textContent : '';
      let succeeded = 0;
      let failed = 0;
      let lastError = '';

      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (titleEl) titleEl.textContent = `Uploading ${i + 1} of ${total}: ${f.name}`;
        const fd = new FormData();
        fd.append('file', f); fd.append('target', email);
        try {
          const res = await fetch('/api/portal/upload', { method:'POST', body: fd });
          const data = await res.json();
          if (data.ok) succeeded++;
          else { failed++; lastError = data.message || 'Upload failed.'; }
        } catch {
          failed++; lastError = 'Network error.';
        }
      }

      if (titleEl) titleEl.textContent = originalTitle;
      zone.classList.remove('is-busy');
      input.value = '';
      busy = false;

      if (succeeded > 0 && failed === 0) {
        toast(succeeded === 1 ? 'File uploaded.' : `${succeeded} files uploaded.`, 'success');
      } else if (succeeded > 0 && failed > 0) {
        toast(`${succeeded} uploaded, ${failed} failed. ${lastError}`.trim(), 'error');
      } else {
        errEl.textContent = lastError || 'Upload failed.';
        toast(lastError || 'Upload failed.', 'error');
      }

      if (succeeded > 0) renderDrillDown(email);
    }
  }


  init();
</script>
</body>
</html>
