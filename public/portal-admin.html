<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · The Avenue Investor Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--teal:#2A6068;--cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);--hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.30)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .admin-pill{background:rgba(212,162,74,0.18);color:var(--gold);border:1px solid rgba(212,162,74,0.45);padding:4px 10px;border-radius:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-left:8px;font-family:'Inter',sans-serif}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3);padding-bottom:1px}

  .body{max-width:1200px;margin:0 auto;padding:32px 32px 80px}
  h1{font-family:'Cormorant Garamond',serif;font-size:32px;color:white;margin:0 0 6px;font-weight:600}
  .h1-sub{color:var(--muted);margin:0 0 28px;font-size:14px}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .summary-cell{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:12px;padding:18px 20px}
  .summary-cell .lbl{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .summary-cell .val{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);line-height:1}

  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:24px;margin-bottom:24px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .card-head h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0;font-weight:600}
  .add-btn{background:var(--gold);color:var(--ink);border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .add-btn:hover{background:var(--gold-hover);color:white}

  table.roster{width:100%;border-collapse:collapse;font-size:13px}
  table.roster th{text-align:left;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--hairline);font-weight:500}
  table.roster td{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,0.06);color:var(--text);vertical-align:middle}
  table.roster tr:last-child td{border-bottom:0}
  table.roster tr:hover{background:rgba(255,255,255,0.03)}
  .name-cell{display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:rgba(212,162,74,0.16);color:var(--gold);border:1px solid rgba(212,162,74,0.35);display:inline-flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:600;flex-shrink:0}
  .investor-name{color:white;font-weight:500}
  .investor-sub{color:var(--muted);font-size:12px}
  .badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;display:inline-block}
  .badge.signed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .badge.pending-lukas{background:rgba(212,162,74,0.16);color:var(--gold)}
  .badge.pending-investor{background:rgba(255,215,138,0.12);color:#F0C56F}
  .badge.removed{background:rgba(255,154,154,0.10);color:#ff9a9a}
  .actions-cell{display:flex;gap:6px;flex-wrap:wrap}
  .row-btn{background:rgba(255,255,255,0.06);border:1px solid var(--hairline);color:var(--text);padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
  .row-btn:hover{border-color:var(--gold);color:var(--gold)}
  .row-btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .row-btn.primary:hover{background:var(--gold-hover);color:white}
  .row-btn.danger:hover{border-color:#ff9a9a;color:#ff9a9a}

  .add-form{background:rgba(0,0,0,0.22);border:1px dashed var(--gold);border-radius:12px;padding:22px;margin-top:14px;display:none}
  .add-form.open{display:block}
  .add-form h3{font-family:'Cormorant Garamond',serif;font-size:18px;color:white;margin:0 0 14px;font-weight:600}
  .add-grid{display:grid;grid-template-columns:1.2fr 1.4fr 0.9fr 0.9fr 0.9fr;gap:10px}
  .field label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--gold)}
  .file-zone{margin-top:12px;border:1.5px dashed var(--hairline);border-radius:10px;padding:18px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer}
  .file-zone:hover{border-color:var(--gold)}
  .file-zone.has-file{border-style:solid;border-color:var(--gold);background:rgba(212,162,74,0.06);color:white}
  .add-actions{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
  .cancel-btn{background:transparent;border:1px solid var(--hairline);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
  .err{color:#ff9a9a;font-size:13px;margin-top:10px;min-height:1.2em}

  /* Drill-down view */
  .breadcrumb{padding:14px 32px;border-bottom:1px solid var(--hairline);font-size:13px;background:rgba(0,0,0,0.18)}
  .breadcrumb a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .breadcrumb .sep{color:var(--muted);margin:0 8px}
  .admin-banner{background:rgba(212,162,74,0.10);border:1px solid rgba(212,162,74,0.4);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:13px;color:var(--cream);display:flex;gap:10px;align-items:center}
  .pdf-frame{width:100%;height:480px;background:var(--ink);border:1px solid var(--hairline);border-radius:10px}
  .pdf-frame iframe{width:100%;height:100%;border:0;border-radius:10px;display:block}
  .upload-zone{border:1.5px dashed var(--hairline);border-radius:12px;padding:24px;text-align:center;margin-bottom:20px;cursor:pointer}
  .upload-zone:hover{border-color:var(--gold)}
  .upload-zone.drag{border-color:var(--gold);background:rgba(212,162,74,0.06)}
  .upload-title{color:white;margin-bottom:4px}
  .upload-sub{color:var(--muted);font-size:12px}
  .doc-list{list-style:none;padding:0;margin:0}
  .doc-list li{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--hairline);border-radius:10px;margin-bottom:8px;font-size:14px}
  .doc-tag{width:36px;height:36px;background:rgba(212,162,74,0.15);color:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
  .doc-tag.signed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .doc-info{flex:1}
  .doc-name{color:white;text-decoration:none}
  .doc-name:hover{text-decoration:underline}
  .doc-meta{color:var(--muted);font-size:12px;margin-top:2px}

  .empty{color:var(--muted);font-style:italic;text-align:center;padding:24px}

  .dataroom-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:12px;font-weight:500;text-decoration:none;margin-right:14px}
  .dataroom-link:hover{background:rgba(218,165,32,0.08)}

  @media (max-width:880px){.summary{grid-template-columns:1fr 1fr}.add-grid{grid-template-columns:1fr 1fr}.brand-tag{display:none}.body{padding:24px 18px 60px}.header{padding:14px 18px}}
  @media (max-width:600px){
    .summary{grid-template-columns:1fr}
    .add-grid{grid-template-columns:1fr}
    table.roster{font-size:11px}
    table.roster th,table.roster td{padding:8px 6px}
    .header{flex-wrap:wrap;gap:10px;padding:12px 16px}
    .brand{font-size:18px;flex:1;min-width:0}
    .admin-pill{padding:3px 7px;font-size:10px;margin-left:6px}
    .status{order:3;width:100%;justify-content:space-between;gap:10px;font-size:12px;padding-top:10px;border-top:1px solid var(--hairline)}
    .status #signed-as{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dataroom-link{margin-right:0;padding:7px 12px;font-size:12px;flex-shrink:0}
    .signout{flex-shrink:0}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span><span class="admin-pill">Admin</span></div>
    <div class="status">
      <span id="signed-as"><span class="status-dot"></span>Loading…</span>
      <a href="/portal/enter-data-room" class="dataroom-link">View the data room →</a>
      <a href="/api/portal/logout" class="signout">Sign out</a>
    </div>
  </div>

  <div id="bcWrap"></div>
  <div class="body" id="body">
    <div style="text-align:center;color:var(--muted);padding:80px 20px">Loading admin dashboard…</div>
  </div>

<script>
  const $body = document.getElementById('body');
  const $signedAs = document.getElementById('signed-as');
  const $bc = document.getElementById('bcWrap');
  const LUKAS_EMAIL = 'bondysconstruction@gmail.com';
  let me = null;
  let roster = null;

  function escape(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}
  function fmtMoney(n){const x=Number(n);return Number.isFinite(x)?x.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}):'—'}
  function fmtDate(iso){if(!iso)return '';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
  function fileExt(name){const m=(name||'').match(/\.([^.]+)$/);return m?m[1].toUpperCase():''}
  function initials(name){return (name||'').split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase()}
  function firstName(n){return (n||'').split(' ')[0]}

  function getSelectedEmail() {
    const p = new URLSearchParams(window.location.search);
    return (p.get('email') || '').toLowerCase().trim();
  }

  async function loadRoster() {
    const res = await fetch('/api/portal/roster');
    if (res.status === 401) { window.location.href = '/'; return; }
    return res.json();
  }

  async function init() {
    const data = await loadRoster();
    if (!data || !data.ok) {
      $body.innerHTML = '<div style="color:#ff9a9a;padding:80px 20px;text-align:center">' + escape((data && data.message)||'Could not load admin.') + '</div>';
      return;
    }
    roster = data;
    try {
      const meRes = await fetch('/api/portal/me');
      if (meRes.ok) me = await meRes.json();
    } catch {}
    if (!me) me = { name: 'Admin', email: '' };
    $signedAs.innerHTML = '<span class="status-dot"></span>Signed in as ' + escape(me.name || 'Admin');

    const drillEmail = getSelectedEmail();
    if (drillEmail) {
      renderDrillDown(drillEmail);
    } else {
      renderRoster();
    }
  }

  function renderRoster() {
    $bc.innerHTML = '';
    const investors = (roster.investors || []).filter(i => !i.deletedAt);
    const removed = (roster.investors || []).filter(i => i.deletedAt);
    const totalCommit = investors.reduce((s, i) => s + (Number(i.principal)||0), 0);
    const numSigned = investors.filter(i => i.state === 'fully-executed').length;
    const numAwaiting = investors.filter(i => i.state !== 'fully-executed').length;

    $body.innerHTML = `
      <h1>Investor roster</h1>
      <p class="h1-sub">All committed investors, their signing status, and their personal folder.</p>
      <div class="summary">
        <div class="summary-cell"><div class="lbl">Investors</div><div class="val">${investors.length}</div></div>
        <div class="summary-cell"><div class="lbl">Signed</div><div class="val">${numSigned}</div></div>
        <div class="summary-cell"><div class="lbl">Awaiting</div><div class="val">${numAwaiting}</div></div>
        <div class="summary-cell"><div class="lbl">Committed capital</div><div class="val">${fmtMoney(totalCommit)}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Document signing</h2>
          <div style="display:flex;gap:8px">
            <a class="row-btn" href="/portal/admin/envelopes" style="text-decoration:none">View all envelopes →</a>
            <a class="add-btn" href="/portal/admin/envelope" style="text-decoration:none">+ Send a document</a>
          </div>
        </div>
        <p style="color:var(--muted);font-size:13px;margin:0">Send any PDF for signature to one or more recipients. Pick where the signatures go, what each signer fills in, and (optionally) the signing order — works for any document, not just promissory notes.</p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>All investors</h2>
          <button class="add-btn" id="addToggle">+ Add investor</button>
        </div>

        ${investors.length === 0 ? '<div class="empty">No investors yet. Click "+ Add investor" to get started.</div>' : `
        <table class="roster">
          <thead><tr>
            <th style="width:26%">Name</th>
            <th style="width:14%">Principal</th>
            <th style="width:20%">Status</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>
            ${investors.map(rowHtml).join('')}
          </tbody>
        </table>
        `}

        <div class="add-form" id="addForm">
          <h3>+ Add new investor</h3>
          <form id="addInvestor">
            <div class="add-grid">
              <div class="field"><label>Full legal name</label><input type="text" name="name" required placeholder="Jane Doe"></div>
              <div class="field"><label>Email</label><input type="email" name="email" required placeholder="jane@example.com"></div>
              <div class="field"><label>Principal ($)</label><input type="number" name="principal" required placeholder="125000"></div>
              <div class="field"><label>Rate (%/yr)</label><input type="text" name="rate" value="20% per annum"></div>
              <div class="field"><label>Term (months)</label><input type="number" name="termMonths" value="20"></div>
            </div>
            <label class="file-zone" id="fileZone" for="blankInput">
              <div style="color:white;margin-bottom:4px">Blank promissory note PDF</div>
              <div>Drop the investor's pre-customized PDF here, or click to browse.</div>
              <div style="font-size:11px;margin-top:6px">Lukas will be emailed to sign as soon as this is saved.</div>
            </label>
            <input type="file" name="blankPdf" id="blankInput" accept="application/pdf" style="display:none" required>
            <div class="add-actions">
              <button type="button" class="cancel-btn" id="cancelAdd">Cancel</button>
              <button type="submit" class="add-btn">Create investor &amp; notify Lukas</button>
            </div>
            <div class="err" id="addErr"></div>
          </form>
        </div>
      </div>

      ${removed.length ? `
      <div class="card" style="opacity:.7">
        <div class="card-head"><h2>Removed</h2></div>
        <table class="roster"><tbody>
          ${removed.map(rowHtml).join('')}
        </tbody></table>
      </div>` : ''}
    `;

    document.getElementById('addToggle').addEventListener('click', () => {
      document.getElementById('addForm').classList.toggle('open');
    });
    document.getElementById('cancelAdd').addEventListener('click', () => {
      document.getElementById('addForm').classList.remove('open');
    });
    document.getElementById('blankInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      const zone = document.getElementById('fileZone');
      if (f) zone.classList.add('has-file'), zone.firstElementChild.textContent = '✓ ' + f.name;
      else zone.classList.remove('has-file');
    });
    document.getElementById('addInvestor').addEventListener('submit', addInvestor);

    // Row action handlers
    document.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', () => rowAction(el.dataset.act, el.dataset.email));
    });
  }

  function rowHtml(inv) {
    const badge =
      inv.deletedAt ? `<span class="badge removed">Removed</span>` :
      inv.state === 'fully-executed' ? `<span class="badge signed">✓ Signed · ${fmtDate(inv.signedAt)}</span>` :
      inv.state === 'awaiting-investor' ? `<span class="badge pending-investor">Awaiting investor</span>` :
      `<span class="badge pending-lukas">Awaiting Lukas</span>`;
    return `<tr>
      <td>
        <div class="name-cell">
          <div class="avatar">${escape(initials(inv.name))}</div>
          <div>
            <div class="investor-name">${escape(inv.name)}</div>
            <div class="investor-sub">${escape(inv.email)}</div>
          </div>
        </div>
      </td>
      <td>${fmtMoney(inv.principal)}</td>
      <td>${badge}</td>
      <td>
        <div class="actions-cell">
          ${inv.deletedAt ? '' : `<button class="row-btn primary" data-act="open" data-email="${escape(inv.email)}">Open folder →</button>`}
          ${inv.state === 'awaiting-lukas' && me && me.email && me.email.toLowerCase() === LUKAS_EMAIL ? `<button class="row-btn" data-act="sign-as-lukas" data-email="${escape(inv.email)}">Sign now</button>` : ''}
          ${inv.deletedAt ? '' : `<button class="row-btn" data-act="resend" data-email="${escape(inv.email)}">Resend link</button>`}
          ${inv.deletedAt ? '' : `<button class="row-btn danger" data-act="remove" data-email="${escape(inv.email)}">Remove</button>`}
        </div>
      </td>
    </tr>`;
  }

  function rowAction(act, email) {
    if (act === 'open') { window.location.search = '?email=' + encodeURIComponent(email); return; }
    if (act === 'sign-as-lukas') { window.location.href = '/portal/admin/sign?email=' + encodeURIComponent(email); return; }
    if (act === 'resend') return resendLink(email);
    if (act === 'remove') return removeInvestor(email);
  }

  async function addInvestor(e) {
    e.preventDefault();
    const errEl = document.getElementById('addErr'); errEl.textContent = '';
    const form = e.currentTarget;
    const fd = new FormData(form);
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const res = await fetch('/api/portal/add-investor', { method:'POST', body: fd });
      const data = await res.json();
      if (data.ok) {
        const r = await loadRoster(); roster = r;
        renderRoster();
      } else {
        errEl.textContent = data.message || 'Could not create.';
        btn.disabled = false; btn.textContent = 'Create investor & notify Lukas';
      }
    } catch (err) {
      errEl.textContent = 'Network error.';
      btn.disabled = false; btn.textContent = 'Create investor & notify Lukas';
    }
  }

  async function resendLink(email) {
    if (!confirm('Email a fresh sign-in link to ' + email + '?')) return;
    try {
      const res = await fetch('/api/portal/resend-link', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, kind: 'setup' })
      });
      const data = await res.json();
      alert(data.ok ? 'Link emailed.' : ('Failed: ' + (data.message||'')));
    } catch (err) { alert('Network error.'); }
  }

  async function removeInvestor(email) {
    if (!confirm('Remove ' + email + '?\\n\\nThey will lose access. Drive folder + signed PDFs are kept.')) return;
    try {
      const res = await fetch('/api/portal/remove-investor', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.ok) { const r = await loadRoster(); roster = r; renderRoster(); }
      else alert('Failed: ' + (data.message||''));
    } catch (err) { alert('Network error.'); }
  }

  // ---------- Drill-down ----------
  async function renderDrillDown(email) {
    $bc.innerHTML = `<div class="breadcrumb"><a href="/portal/admin">Investor roster</a><span class="sep">/</span><span style="color:white" id="bcName">${escape(email)}</span></div>`;
    let res;
    try {
      res = await fetch('/api/portal/folder?email=' + encodeURIComponent(email));
    } catch { $body.innerHTML = '<div class="empty">Network error.</div>'; return; }
    if (res.status === 401) { window.location.href='/'; return; }
    const data = await res.json();
    if (!data.ok) { $body.innerHTML = '<div class="empty">' + escape(data.message||'Not found.') + '</div>'; return; }
    const inv = data.investor;
    document.getElementById('bcName').textContent = inv.name;
    const files = data.files || [];
    const blankFile = files.find(f => f.name === 'blank-promissory-note.pdf');
    const lukasFile = files.find(f => f.name === 'lukas-signed-promissory-note.pdf');
    const signedFile = files.find(f => f.name === 'signed-promissory-note.pdf');
    const preview = signedFile || lukasFile || blankFile;
    const isLukas = me && me.email && me.email.toLowerCase() === LUKAS_EMAIL;
    const stateLabel =
      inv.signedAt ? `<span style="color:#9FD6A8">✓ Fully executed · ${fmtDate(inv.signedAt)}</span>` :
      inv.lukasSignedAt ? `<span style="color:var(--gold)">Awaiting investor signature</span>` :
      `<span style="color:var(--gold)">Awaiting Lukas's signature</span>`;

    $body.innerHTML = `
      <div class="admin-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        You're viewing this folder as an admin. Uploads you make here will be saved to <strong>${escape(inv.name)}</strong>'s Drive folder.
      </div>

      <h1>${escape(firstName(inv.name))}'s <em style="font-family:inherit;color:var(--gold);font-style:normal">documents</em></h1>
      <p class="h1-sub">${escape(inv.email)} · ${fmtMoney(inv.principal)} · ${escape(inv.rate||'')} · ${escape(String(inv.termMonths||''))} months</p>

      <div class="card">
        <div class="card-head"><h2>Note terms</h2></div>
        <div style="font-size:14px">
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="color:var(--muted)">Principal</span><span style="color:white">${fmtMoney(inv.principal)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="color:var(--muted)">Interest rate</span><span style="color:white">${escape(inv.rate||'')}</span></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="color:var(--muted)">Term</span><span style="color:white">${escape(String(inv.termMonths||''))} months</span></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0"><span style="color:var(--muted)">Status</span><span style="color:white">${stateLabel}</span></div>
        </div>
        ${isLukas && !inv.lukasSignedAt && blankFile ? `<a href="/portal/admin/sign?email=${encodeURIComponent(inv.email)}" class="add-btn" style="margin-top:14px;display:inline-block;text-decoration:none">Sign as Debtor &amp; Guarantor →</a>` : ''}
      </div>

      ${preview ? `<div class="card">
        <div class="card-head"><h2>${signedFile?'Fully executed':lukasFile?'Lukas-signed (awaiting investor)':'Blank (awaiting Lukas)'}</h2></div>
        <div class="pdf-frame"><iframe src="https://drive.google.com/file/d/${preview.id}/preview" sandbox="allow-scripts allow-same-origin allow-popups"></iframe></div>
      </div>` : ''}

      <div class="card">
        <div class="card-head"><h2>All documents</h2></div>
        <p style="color:var(--muted);font-size:13px;margin:-8px 0 14px">Drop files to add to ${escape(inv.name)}'s folder. They'll see them next sign-in.</p>
        <form id="adminUploadForm">
          <label class="upload-zone" id="adminUploadZone" for="adminUploadInput">
            <div class="upload-title">Upload to ${escape(inv.name)}'s folder</div>
            <div class="upload-sub">25 MB per file</div>
          </label>
          <input type="file" id="adminUploadInput" style="display:none">
        </form>
        <div class="err" id="adminUpErr"></div>
        <ul class="doc-list" id="adminDocList"></ul>
      </div>
    `;
    renderDocList(files);
    wireAdminUpload(inv.email);
  }

  function renderDocList(files) {
    const list = document.getElementById('adminDocList');
    if (!list) return;
    if (!files.length) { list.innerHTML = '<li class="empty">No documents yet.</li>'; return; }
    list.innerHTML = files.map(f => {
      const ext = fileExt(f.name);
      const isSigned = f.name === 'signed-promissory-note.pdf';
      return `<li>
        <span class="doc-tag${isSigned?' signed':''}">${escape(ext||'FILE')}</span>
        <div class="doc-info">
          <a class="doc-name" href="${escape(f.url)}" target="_blank" rel="noopener">${escape(f.name)}</a>
          <div class="doc-meta">${fmtDate(f.createdTime)}</div>
        </div>
      </li>`;
    }).join('');
  }

  function wireAdminUpload(email) {
    const zone = document.getElementById('adminUploadZone');
    const input = document.getElementById('adminUploadInput');
    const errEl = document.getElementById('adminUpErr');
    input.addEventListener('change', () => doUpload(input.files));
    ;['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
    ;['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
    zone.addEventListener('drop', e => { e.preventDefault(); doUpload(e.dataTransfer.files); });
    async function doUpload(files) {
      errEl.textContent = '';
      for (const f of files) {
        const fd = new FormData(); fd.append('file', f); fd.append('target', email);
        try {
          const res = await fetch('/api/portal/upload', { method:'POST', body: fd });
          const data = await res.json();
          if (!data.ok) { errEl.textContent = data.message || 'Upload failed.'; return; }
        } catch { errEl.textContent = 'Network error.'; return; }
      }
      renderDrillDown(email);
    }
  }

  init();
</script>
</body>
</html>
