<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your investor portal · The Avenue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--teal:#2A6068;
    --cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);
    --hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.22)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3);padding-bottom:1px}

  /* Tab nav */
  .tabnav{position:sticky;top:0;z-index:50;display:flex;gap:2px;padding:0 32px;background:rgba(15,38,42,0.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline);overflow-x:auto;scrollbar-width:none}
  .tabnav::-webkit-scrollbar{display:none}
  .tab{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;padding:16px 16px;cursor:pointer;white-space:nowrap;transition:color .15s;display:inline-flex;align-items:center;gap:8px}
  .tab:hover{color:var(--text)}
  .tab.is-active{color:var(--gold);border-bottom-color:var(--gold)}
  .tab .pip{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
  .tab .pip.show{display:inline-flex}

  .body{max-width:960px;margin:0 auto;padding:32px 32px 80px}
  .panel{display:none}
  .panel.is-active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .eyebrow{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:500}
  .dataroom-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;background:rgba(0,0,0,0.30);color:var(--gold);border:1px solid var(--gold);border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;transition:background 0.2s,color 0.2s,transform 0.2s;backdrop-filter:blur(4px);cursor:pointer;font-family:inherit}
  .dataroom-btn:hover{background:var(--gold);color:var(--ink);transform:translateY(-1px)}

  /* Overview hero banner */
  .ov-hero{position:relative;border-radius:16px;overflow:hidden;padding:44px 32px;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:24px;border:1px solid var(--hairline);text-shadow:0 2px 14px rgba(0,0,0,0.4);background-image:linear-gradient(to bottom, rgba(15,38,42,0.25) 0%, rgba(15,38,42,0.55) 55%, rgba(31,74,82,0.96) 100%),url('/hero-rendering.jpg');background-size:cover;background-position:center 35%}
  .ov-hero .eyebrow{color:#E5C385}
  .ov-hero h1{font-family:'Cormorant Garamond',serif;font-size:42px;line-height:1.05;color:white;margin:0 0 10px;font-weight:600}
  .ov-hero h1 em{font-family:inherit;color:var(--gold);font-style:normal}
  .ov-hero p{font-size:15px;color:rgba(255,255,255,0.88);margin:0 0 22px;max-width:560px}

  .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .quick-card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s}
  .quick-card:hover{border-color:var(--gold);transform:translateY(-1px)}
  .qc-ico{width:38px;height:38px;border-radius:10px;background:rgba(212,162,74,0.15);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .qc-ico svg{width:20px;height:20px}
  .qc-title{color:white;font-weight:600;margin-bottom:3px}
  .qc-sub{color:var(--muted);font-size:12px}

  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:26px;margin-bottom:22px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0 0 14px;font-weight:600}
  .card .lead{font-size:13px;color:var(--muted);margin:-8px 0 18px}
  .page-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:white;margin:0 0 4px;font-weight:600}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 22px}

  .terms-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px}
  .terms-row:last-child{border-bottom:0}
  .terms-row .lbl{color:var(--muted)}
  .terms-row .val{color:white;font-weight:500}

  .err{color:#ff9a9a;font-size:13px;margin-top:10px;min-height:1.2em}
  .sign-btn{padding:12px 20px;background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .sign-btn:disabled{opacity:0.5;cursor:not-allowed}
  .sign-btn:hover:not(:disabled){background:var(--gold-hover);color:white}

  .upload-zone{border:1.5px dashed var(--hairline);border-radius:12px;padding:30px 20px;text-align:center;margin-bottom:18px;cursor:pointer}
  .upload-zone:hover{border-color:var(--gold)}
  .upload-zone.drag{border-color:var(--gold);background:rgba(212,162,74,0.06)}
  .upload-icon{width:44px;height:44px;margin:0 auto 12px;border-radius:50%;background:rgba(212,162,74,0.16);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px}
  .upload-title{color:white;margin-bottom:4px}
  .upload-sub{color:var(--muted);font-size:12px}
  .doc-list{list-style:none;padding:0;margin:0}
  .doc-list li{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--hairline);border-radius:10px;margin-bottom:8px;font-size:14px}
  .doc-list li:hover{border-color:var(--gold)}
  .doc-tag{width:36px;height:36px;background:rgba(212,162,74,0.15);color:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:0.04em;flex-shrink:0}
  .doc-info{flex:1;min-width:0}
  .doc-name{color:white;font-size:14px;text-decoration:none}
  .doc-name:hover{text-decoration:underline}
  .doc-meta{color:var(--muted);font-size:12px;margin-top:2px}
  .empty-note{color:var(--muted);font-style:italic;font-size:13px;text-align:center;padding:24px 8px}

  /* Messages */
  .msg-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:52vh;overflow-y:auto;padding-right:4px}
  .msg-row{max-width:80%}
  .msg-meta{font-size:11px;color:var(--muted);margin-bottom:3px}
  .msg-bubble{border:1px solid var(--hairline);border-radius:12px;padding:10px 13px;font-size:14px;white-space:pre-wrap}
  .msg-row.mine{align-self:flex-end}
  .msg-row.mine .msg-meta{text-align:right}
  .msg-row.mine .msg-bubble{background:rgba(212,162,74,0.16)}
  .msg-row.theirs .msg-bubble{background:rgba(255,255,255,0.06)}
  .msg-compose{display:flex;gap:10px;align-items:flex-end}
  .msg-compose textarea{flex:1;padding:11px 13px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
  .msg-compose textarea:focus{outline:none;border-color:var(--gold)}

  .update-item{padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
  .update-item:last-child{border-bottom:0}
  .update-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .update-title{color:white;font-weight:600;font-size:15px}
  .update-date{color:var(--muted);font-size:12px;white-space:nowrap}
  .update-body{color:var(--text);font-size:14px;margin-top:6px;white-space:pre-wrap}

  @media (max-width:720px){
    .header{padding:12px 16px;flex-wrap:wrap;gap:8px}
    .brand-tag{display:none}
    .status{font-size:12px;gap:10px}
    .tabnav{padding:0 10px}
    .tab{padding:14px 12px;font-size:13px}
    .body{padding:22px 16px 64px;max-width:100%}
    .ov-hero{padding:32px 20px;min-height:220px;border-radius:14px}
    .ov-hero h1{font-size:30px}
    .ov-hero p{font-size:14px}
    .quick-grid{grid-template-columns:1fr;gap:10px}
    .card{padding:18px 16px;border-radius:12px}
    .card h2{font-size:19px}
    .page-title{font-size:24px}
    .doc-list li{padding:10px 12px;gap:10px}
    .doc-name{word-break:break-word}
    .msg-row{max-width:88%}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span></div>
    <div class="status">
      <span id="signed-as"><span class="status-dot"></span>Loading…</span>
      <a href="/api/portal/logout" class="signout">Sign out</a>
    </div>
  </div>

  <nav class="tabnav" id="tabnav" role="tablist">
    <button class="tab is-active" data-tab="overview" role="tab">Overview</button>
    <button class="tab" data-tab="documents" role="tab">Documents</button>
    <button class="tab" data-tab="updates" role="tab">Updates</button>
    <button class="tab" data-tab="messages" role="tab">Messages <span class="pip" id="msgPip">0</span></button>
  </nav>

  <div class="body">
    <section class="panel is-active" data-panel="overview" id="panel-overview">
      <div class="empty-note">Loading your portal…</div>
    </section>
    <section class="panel" data-panel="documents" id="panel-documents"></section>
    <section class="panel" data-panel="updates" id="panel-updates"></section>
    <section class="panel" data-panel="messages" id="panel-messages"></section>
  </div>

<script>
  const $signedAs = document.getElementById('signed-as');
  const $ov = document.getElementById('panel-overview');
  const $docs = document.getElementById('panel-documents');
  const $updates = document.getElementById('panel-updates');
  const $messages = document.getElementById('panel-messages');

  function showFatal(msg, detail) {
    const safe = String(msg || 'Unknown error');
    const det = detail ? '<pre style="white-space:pre-wrap;font-size:11px;color:rgba(255,255,255,0.5);max-width:600px;margin:14px auto 0;text-align:left;background:rgba(0,0,0,0.25);padding:12px;border-radius:8px;overflow:auto">' + String(detail).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]) + '</pre>' : '';
    $ov.innerHTML = '<div style="color:#ff9a9a;padding:60px 20px;text-align:center">' + safe + ' <a href="javascript:location.reload()" style="color:var(--gold);margin-left:8px">Reload</a> · <a href="/api/portal/logout" style="color:var(--gold)">Sign out</a>' + det + '</div>';
  }
  window.addEventListener('error', e => showFatal('Page error: ' + (e.message || 'unknown'), (e.error && e.error.stack) || e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => showFatal('Network or script error', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));

  function escape(s){ return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]); }
  function fmtMoney(n){ const x=Number(n); return Number.isFinite(x) ? x.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}) : '—'; }
  function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
  function fileExt(name){ const m=(name||'').match(/\.([^.]+)$/); return m ? m[1].toUpperCase() : ''; }
  function firstName(n){ return (n||'').split(' ')[0]; }

  let state = { investor: null, files: [] };

  function fetchWithTimeout(url, opts = {}, ms = 9000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
  }

  function normalizeInvestor(raw, fallbackEmail) {
    const r = raw || {};
    return {
      name: r.name || (fallbackEmail ? fallbackEmail.split('@')[0] : 'Investor'),
      email: r.email || fallbackEmail || '',
      principal: r.principal || 0,
      rate: r.rate || '',
      termMonths: r.termMonths || '',
      equityAmount: r.equityAmount || 0,
      ownershipPct: r.ownershipPct || 0,
      folderId: r.folderId || null,
      status: r.status || 'active',
      deletedAt: r.deletedAt || null
    };
  }

  // ---------- Tabs ----------
  function activateTab(name) {
    if (!name) name = 'overview';
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('is-active', p.dataset.panel === name));
    if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
    window.scrollTo({ top: 0 });
  }
  document.getElementById('tabnav').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (b) activateTab(b.dataset.tab);
  });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-goto]');
    if (g) { e.preventDefault(); activateTab(g.dataset.goto); }
  });

  async function load() {
    let me;
    try {
      const meRes = await fetchWithTimeout('/api/portal/me', {}, 9000);
      if (meRes.status === 401) { window.location.href = '/portal/sign-in'; return; }
      try { me = JSON.parse(await meRes.text()); } catch { me = null; }
    } catch (err) { console.warn('[portal] /me failed:', err); }

    state.investor = (me && me.ok && me.investor)
      ? normalizeInvestor(me.investor, me.email)
      : normalizeInvestor(null, (me && me.email) || '');

    renderShell();
    activateTab(location.hash.slice(1) || 'overview');

    loadUpdates();
    loadMessages();

    try {
      const folderRes = await fetchWithTimeout('/api/portal/folder', {}, 12000);
      const data = await folderRes.json();
      if (data && data.ok) { state.files = data.files || []; renderDocList(); }
    } catch (err) { console.warn('folder fetch failed:', err); }
  }

  // Build the static panels (Overview + Documents). Updates/Messages are filled async.
  function renderShell() {
    const inv = state.investor;
    $signedAs.innerHTML = '<span class="status-dot"></span>Signed in as ' + escape(inv.name);

    // ---- Overview ----
    const hasDebt = Number(inv.principal) > 0;
    const hasEquity = Number(inv.equityAmount) > 0 || Number(inv.ownershipPct) > 0;
    let invRows = '';
    if (hasDebt) {
      invRows += `<div class="terms-row"><span class="lbl">${hasEquity ? 'Interest principal' : 'Principal'}</span><span class="val">${fmtMoney(inv.principal)}</span></div>`;
      invRows += `<div class="terms-row"><span class="lbl">Interest rate</span><span class="val">${escape(inv.rate||'—')}</span></div>`;
      invRows += `<div class="terms-row"><span class="lbl">Term</span><span class="val">${inv.termMonths ? escape(String(inv.termMonths)) + ' months' : '—'}</span></div>`;
    }
    if (hasEquity) {
      if (Number(inv.equityAmount) > 0) invRows += `<div class="terms-row"><span class="lbl">Equity investment</span><span class="val">${fmtMoney(inv.equityAmount)}</span></div>`;
      if (Number(inv.ownershipPct) > 0) invRows += `<div class="terms-row"><span class="lbl">Ownership</span><span class="val">${escape(String(inv.ownershipPct))}%</span></div>`;
    }
    invRows += `<div class="terms-row"><span class="lbl">Status</span><span class="val"><span style="color:#9FD6A8">● Active</span></span></div>`;

    $ov.innerHTML = `
      <div class="ov-hero">
        <div class="eyebrow">Investor Portal · The Avenue at Fountain Hills</div>
        <h1>Welcome, <em>${escape(firstName(inv.name))}</em>.</h1>
        <p>Your home for the deal documents, updates, and direct line to us on The Avenue at Fountain Hills.</p>
        <a href="/portal/enter-data-room" class="dataroom-btn">View the data room →</a>
      </div>
      ${(hasDebt || hasEquity) ? `<div class="card"><h2>Your investment</h2>${invRows}</div>` : ''}
      <div class="quick-grid">
        <div class="quick-card" data-goto="documents">
          <div class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="qc-title">Documents</div>
          <div class="qc-sub">Your files & uploads</div>
        </div>
        <div class="quick-card" data-goto="updates">
          <div class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
          <div class="qc-title">Updates</div>
          <div class="qc-sub">Latest deal news</div>
        </div>
        <div class="quick-card" data-goto="messages">
          <div class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div class="qc-title">Messages</div>
          <div class="qc-sub">Talk to us directly</div>
        </div>
      </div>
    `;

    // ---- Documents ----
    $docs.innerHTML = `
      <h1 class="page-title">Documents</h1>
      <p class="page-sub">The full deal package lives in the data room. Your personal files are below.</p>
      <div class="card">
        <h2>Deal data room</h2>
        <p class="lead">The investor presentation, appraisal, budget, plans, approvals and more.</p>
        <a href="/portal/enter-data-room" class="dataroom-btn">Open the data room →</a>
      </div>
      <div class="card">
        <h2>Your documents</h2>
        <p class="lead">Documents we share with you appear here. Upload anything we request — accreditation letter, ID, wire confirmation — saved straight to your folder.</p>
        <label class="upload-zone" id="uploadZone" for="uploadInput">
          <div class="upload-icon">↑</div>
          <div class="upload-title">Drop files or click to upload</div>
          <div class="upload-sub">PDF, JPG, PNG · up to 25 MB per file</div>
        </label>
        <input type="file" id="uploadInput" style="display:none">
        <div class="err" id="upErr"></div>
        <ul class="doc-list" id="docList"><li class="empty-note" style="background:none;border:0">Loading…</li></ul>
      </div>
    `;
    wireUpload();
    renderDocList();
  }

  function renderDocList() {
    const list = document.getElementById('docList');
    if (!list) return;
    const files = state.files || [];
    if (!files.length) { list.innerHTML = '<li class="empty-note" style="background:none;border:0">No documents yet.</li>'; return; }
    list.innerHTML = files.map(f => `<li>
      <span class="doc-tag">${escape(fileExt(f.name)||'FILE')}</span>
      <div class="doc-info">
        <a class="doc-name" href="${escape(f.url)}" target="_blank" rel="noopener">${escape(f.name)}</a>
        <div class="doc-meta">${fmtDate(f.createdTime)}</div>
      </div>
    </li>`).join('');
  }

  function wireUpload() {
    const zone = document.getElementById('uploadZone');
    const input = document.getElementById('uploadInput');
    const errEl = document.getElementById('upErr');
    if (!zone || !input) return;
    input.addEventListener('change', () => doUpload(input.files));
    ;['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
    ;['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
    zone.addEventListener('drop', e => { e.preventDefault(); doUpload(e.dataTransfer.files); });

    async function doUpload(files) {
      errEl.textContent = '';
      if (!files || !files.length) return;
      for (const f of files) {
        const fd = new FormData();
        fd.append('file', f);
        try {
          const res = await fetch('/api/portal/upload', { method:'POST', body: fd });
          const data = await res.json();
          if (!data.ok) { errEl.textContent = data.message || 'Upload failed.'; return; }
        } catch (err) { errEl.textContent = 'Network error.'; return; }
      }
      // Refresh just the file list.
      try {
        const folderRes = await fetchWithTimeout('/api/portal/folder', {}, 12000);
        const data = await folderRes.json();
        if (data && data.ok) { state.files = data.files || []; renderDocList(); }
      } catch {}
    }
  }

  // ---------- Updates ----------
  async function loadUpdates() {
    try {
      const r = await fetchWithTimeout('/api/portal/updates', {}, 9000);
      const d = r.ok ? await r.json() : null;
      const updates = (d && d.updates) || [];
      $updates.innerHTML = `
        <h1 class="page-title">Updates</h1>
        <p class="page-sub">The latest from us on The Avenue at Fountain Hills.</p>
        <div class="card">
          ${updates.length ? updates.map(u => `
            <div class="update-item">
              <div class="update-head">
                <div class="update-title">${escape(u.title || 'Update')}</div>
                <div class="update-date">${fmtDate(u.createdAt)}</div>
              </div>
              ${u.body ? `<div class="update-body">${escape(u.body)}</div>` : ''}
            </div>`).join('') : '<div class="empty-note">No updates yet. We\'ll post deal news here.</div>'}
        </div>`;
    } catch (err) { console.warn('updates load failed:', err); }
  }

  // ---------- Messages ----------
  async function loadMessages() {
    try {
      const r = await fetchWithTimeout('/api/portal/messages', {}, 9000);
      const d = r.ok ? await r.json() : null;
      const messages = (d && d.messages) || [];
      $messages.innerHTML = `
        <h1 class="page-title">Messages</h1>
        <p class="page-sub">Questions for us? Send a message — we reply here and by email.</p>
        <div class="card">
          <div class="msg-thread" id="msgThread">${renderMsgThread(messages)}</div>
          <form class="msg-compose" id="msgForm">
            <textarea id="msgInput" rows="2" placeholder="Write a message…"></textarea>
            <button type="submit" class="sign-btn" id="msgSend">Send</button>
          </form>
          <div class="err" id="msgErr"></div>
        </div>`;
      const thread = document.getElementById('msgThread');
      if (thread) thread.scrollTop = thread.scrollHeight;
      wireMessageForm();
    } catch (err) { console.warn('messages load failed:', err); }
  }

  function renderMsgThread(messages) {
    if (!messages.length) return '<div class="empty-note">No messages yet. Start the conversation below.</div>';
    return messages.map(m => {
      const mine = m.from === 'investor';
      return `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
        <div class="msg-meta">${mine ? 'You' : 'The Avenue'} · ${fmtDate(m.createdAt)}</div>
        <div class="msg-bubble">${escape(m.body)}</div>
      </div>`;
    }).join('');
  }

  function wireMessageForm() {
    const form = document.getElementById('msgForm');
    const input = document.getElementById('msgInput');
    const errEl = document.getElementById('msgErr');
    const btn = document.getElementById('msgSend');
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = (input.value || '').trim();
      errEl.textContent = '';
      if (!body) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/portal/messages', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        const data = await res.json();
        if (data.ok) { input.value = ''; loadMessages(); }
        else errEl.textContent = data.message || 'Could not send.';
      } catch { errEl.textContent = 'Network error. Try again.'; }
      finally { btn.disabled = false; btn.textContent = 'Send'; }
    });
  }

  load();
</script>
</body>
</html>
