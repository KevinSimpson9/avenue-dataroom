<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your investor portal · The Avenue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--teal:#2A6068;
    --cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);
    --hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.22)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3);padding-bottom:1px}

  .body{max-width:960px;margin:0 auto;padding:40px 32px 80px}

  /* Full-bleed hero with rendering — matches the data-room banner. */
  .portal-hero{
    position:relative;
    padding:120px 32px 80px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:flex-end;
    background-image:
      linear-gradient(to bottom, rgba(15,38,42,0.30) 0%, rgba(15,38,42,0.55) 55%, rgba(31,74,82,0.97) 100%),
      url('/hero-rendering.jpg');
    background-size:cover;
    background-position:center 32%;
    background-repeat:no-repeat;
    text-shadow:0 2px 14px rgba(0,0,0,0.4);
    border-bottom:1px solid var(--hairline);
  }
  .portal-hero-inner{max-width:960px;width:100%;margin:0 auto}
  .portal-hero .eyebrow{color:#E5C385;text-shadow:0 1px 6px rgba(0,0,0,0.5)}
  .portal-hero h1{font-family:'Cormorant Garamond',serif;font-size:52px;line-height:1.05;color:white;margin:0 0 14px;font-weight:600;letter-spacing:-0.01em}
  .portal-hero h1 em{font-family:inherit;color:var(--gold);font-style:normal}
  .portal-hero p{font-size:16px;color:rgba(255,255,255,0.86);margin:0 0 24px;max-width:640px;line-height:1.5}

  .eyebrow{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:500}
  .dataroom-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;background:rgba(0,0,0,0.30);color:var(--gold);border:1px solid var(--gold);border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;transition:background 0.2s,color 0.2s,transform 0.2s;backdrop-filter:blur(4px)}
  .dataroom-btn:hover{background:var(--gold);color:var(--ink);transform:translateY(-1px)}

  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:26px;margin-bottom:26px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:white;margin:0 0 14px;font-weight:600}
  .card .lead{font-size:13px;color:var(--muted);margin:-8px 0 18px}

  .terms-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px}
  .terms-row:last-child{border-bottom:0}
  .terms-row .lbl{color:var(--muted)}
  .terms-row .val{color:white;font-weight:500}
  .terms-row .val em{color:var(--gold);font-style:normal;font-family:'Cormorant Garamond',serif;font-size:1.1em}

  .banner{padding:14px 18px;border-radius:12px;display:flex;align-items:center;gap:14px;font-size:14px;margin-bottom:18px}
  .banner.wait{background:rgba(212,162,74,0.10);border:1px solid rgba(212,162,74,0.4);color:var(--cream)}
  .banner.signed{background:rgba(159,214,168,0.14);border:1px solid rgba(159,214,168,0.4);color:#9FD6A8}
  .banner svg{flex-shrink:0;width:22px;height:22px}

  .pdf-frame{width:100%;height:520px;background:var(--ink);border:1px solid var(--hairline);border-radius:10px;margin-bottom:18px}
  .pdf-frame iframe{width:100%;height:100%;border:0;border-radius:10px;display:block}

  .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--gold)}
  .field input.sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;letter-spacing:0.02em}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:14px 0 18px}
  .agree input{margin-top:3px}
  .sign-btn{width:100%;padding:16px;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .sign-btn:disabled{opacity:0.5;cursor:not-allowed}
  .sign-btn:hover:not(:disabled){background:var(--gold-hover);color:white}
  .err{color:#ff9a9a;font-size:13px;margin-top:10px;min-height:1.2em}
  .ok{color:#9FD6A8;font-size:13px;margin-top:10px}

  .upload-zone{border:1.5px dashed var(--hairline);border-radius:12px;padding:30px 20px;text-align:center;margin-bottom:22px;cursor:pointer}
  .upload-zone:hover{border-color:var(--gold)}
  .upload-zone.drag{border-color:var(--gold);background:rgba(212,162,74,0.06)}
  .upload-icon{width:44px;height:44px;margin:0 auto 12px;border-radius:50%;background:rgba(212,162,74,0.16);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px}
  .upload-title{color:white;margin-bottom:4px}
  .upload-sub{color:var(--muted);font-size:12px}
  .doc-list{list-style:none;padding:0;margin:0}
  .doc-list li{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-soft);border:1px solid var(--hairline);border-radius:10px;margin-bottom:8px;font-size:14px;text-decoration:none;color:inherit}
  .doc-list li:hover{border-color:var(--gold)}
  .doc-tag{width:36px;height:36px;background:rgba(212,162,74,0.15);color:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:0.04em;flex-shrink:0}
  .doc-tag.signed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .doc-info{flex:1}
  .doc-name{color:white;font-size:14px;text-decoration:none}
  .doc-name:hover{text-decoration:underline}
  .doc-meta{color:var(--muted);font-size:12px;margin-top:2px}

  .footer-msg{margin-top:18px;font-size:12px;color:rgba(255,255,255,0.55);font-style:italic;text-align:center}
  .dataroom-footer{display:flex;justify-content:center;margin:8px 0 4px;padding-top:8px}
  .dataroom-footer .dataroom-btn{min-width:280px;justify-content:center}
  @media (max-width:720px){
    .header{padding:12px 16px;flex-wrap:wrap;gap:8px}
    .brand-tag{display:none}
    .status{font-size:12px;gap:10px;flex-wrap:wrap}
    .status-dot{width:7px;height:7px;margin-right:4px}
    .body{padding:24px 16px 64px;max-width:100%}
    .portal-hero{padding:80px 18px 44px;min-height:360px;background-position:center 38%}
    .portal-hero h1{font-size:34px;line-height:1.1}
    .portal-hero p{font-size:14px;margin-bottom:18px}
    .dataroom-btn{width:100%;justify-content:center;font-size:13px;padding:12px 14px}
    .dataroom-footer{margin:4px 0 2px;padding-top:4px}
    .dataroom-footer .dataroom-btn{min-width:0;width:100%}
    .card{padding:18px 16px;margin-bottom:18px;border-radius:12px}
    .card h2{font-size:19px}
    .card .lead{font-size:12px}
    .eyebrow{font-size:10px;letter-spacing:0.18em}
    .terms-row{font-size:13px;padding:10px 0;flex-wrap:wrap;gap:4px}
    .terms-row .lbl{font-size:12px}
    .pdf-frame{height:62vh;min-height:340px;border-radius:8px}
    .sig-grid{grid-template-columns:1fr;gap:10px;margin-bottom:10px}
    .field input{padding:11px 13px;font-size:14px}
    .field input.sig{font-size:18px}
    .field label{font-size:10px}
    .agree{font-size:12px;margin:10px 0 14px}
    .sign-btn{padding:14px;font-size:15px}
    .banner{padding:12px 14px;font-size:13px;border-radius:10px}
    .banner svg{width:18px;height:18px}
    .banner .title{font-size:14px}
    .upload-zone{padding:22px 14px}
    .upload-icon{width:36px;height:36px;font-size:17px;margin-bottom:8px}
    .upload-title{font-size:13px}
    .upload-sub{font-size:11px}
    .doc-list li{padding:10px 12px;gap:10px;font-size:13px}
    .doc-tag{width:30px;height:30px;font-size:9px}
    .doc-name{font-size:13px;word-break:break-word}
    .doc-meta{font-size:11px}
  }
  @media (max-width:380px){
    .portal-hero{padding:64px 14px 36px;min-height:320px}
    .portal-hero h1{font-size:28px}
    .body{padding:20px 12px 56px}
    .card{padding:16px 14px}
    .pdf-frame{height:54vh;min-height:300px}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span></div>
    <div class="status">
      <span id="signed-as"><span class="status-dot"></span>Loading…</span>
      <a href="/api/portal/logout" class="signout">Sign out</a>
    </div>
  </div>

  <section class="portal-hero">
    <div class="portal-hero-inner" id="hero">
      <div class="eyebrow">Investor Portal · The Avenue at Fountain Hills</div>
      <h1>Welcome.</h1>
      <p>Loading your portal…</p>
    </div>
  </section>

  <div class="body" id="body"></div>

<script>
  const $body = document.getElementById('body');
  const $hero = document.getElementById('hero');
  const $signedAs = document.getElementById('signed-as');

  function showFatal(msg, detail) {
    const safe = String(msg || 'Unknown error');
    const det = detail ? '<pre style="white-space:pre-wrap;font-size:11px;color:rgba(255,255,255,0.5);max-width:600px;margin:14px auto 0;text-align:left;background:rgba(0,0,0,0.25);padding:12px;border-radius:8px;overflow:auto">' + String(detail).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]) + '</pre>' : '';
    $body.innerHTML = '<div style="color:#ff9a9a;padding:60px 20px;text-align:center">' + safe + ' <a href="javascript:location.reload()" style="color:var(--gold);margin-left:8px">Reload</a> · <a href="/api/portal/logout" style="color:var(--gold)">Sign out</a>' + det + '</div>';
  }

  window.addEventListener('error', e => {
    showFatal('Page error: ' + (e.message || 'unknown'), (e.error && e.error.stack) || e.filename + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', e => {
    showFatal('Network or script error', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
  });

  function $(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function escape(s){ return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]); }
  function fmtMoney(n){ const x=Number(n); return Number.isFinite(x) ? x.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}) : '—'; }
  function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
  function fileExt(name){ const m=(name||'').match(/\.([^.]+)$/); return m ? m[1].toUpperCase() : ''; }

  let state = { investor: null, files: [] };

  function fetchWithTimeout(url, opts = {}, ms = 9000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
  }

  function normalizeInvestor(raw, fallbackEmail) {
    const r = raw || {};
    return {
      name: r.name || (fallbackEmail ? fallbackEmail.split('@')[0] : 'Investor'),
      email: r.email || fallbackEmail || '',
      principal: r.principal || 0,
      rate: r.rate || '',
      termMonths: r.termMonths || '',
      folderId: r.folderId || null,
      status: r.status || 'active',
      addedAt: r.addedAt || null,
      deletedAt: r.deletedAt || null
    };
  }

  function safeRender(label) {
    try {
      render();
    } catch (err) {
      console.error('[portal] render failed at', label, err);
      showFatal('Render failed (' + label + ').', (err && err.stack) || String(err));
    }
  }

  async function load() {
    // Always render the shell first with whatever we have, so the investor
    // sees their portal even if /me is slow or partial.
    let meRes, meText, me;
    try {
      meRes = await fetchWithTimeout('/api/portal/me', {}, 9000);
      if (meRes.status === 401) { window.location.href = '/portal/sign-in'; return; }
      meText = await meRes.text();
      try { me = JSON.parse(meText); } catch { me = null; }
    } catch (err) {
      console.warn('[portal] /me failed:', err);
    }

    if (me && me.ok && me.investor) {
      state.investor = normalizeInvestor(me.investor, me.email);
    } else {
      // Fall back to a stub so the page still renders. Investor can still
      // upload docs, sign out, and see the welcome state.
      const email = (me && me.email) || '';
      state.investor = normalizeInvestor(null, email);
      console.warn('[portal] using stub investor — /me returned:', me);
    }
    safeRender('initial');

    // Stage 2: fetch file list separately so a slow Drive call never blocks the page.
    try {
      const folderRes = await fetchWithTimeout('/api/portal/folder', {}, 12000);
      const data = await folderRes.json();
      if (data && data.ok) {
        state.files = data.files || [];
        // Re-render now that file list is in.
        safeRender('post-folder');
      }
    } catch (err) {
      // Non-fatal — file list just stays empty. Page still works for signing.
      console.warn('folder fetch failed:', err);
    }
  }

  function render() {
    const inv = state.investor;
    const files = state.files || [];
    $signedAs.innerHTML = '<span class="status-dot"></span>Signed in as ' + escape(inv.name);

    if ($hero) {
      $hero.innerHTML = `
        <div class="eyebrow">Investor Portal · The Avenue at Fountain Hills</div>
        <h1>Welcome, <em>${escape(firstName(inv.name))}</em>.</h1>
        <p>Your home for documents, updates, and anything you need from us on The Avenue at Fountain Hills.</p>
        <a href="/portal/enter-data-room" class="dataroom-btn">View the data room →</a>
      `;
    }

    let html = '';

    // Investment summary
    const principalSet = Number(inv.principal) > 0;
    if (principalSet) {
      html += `
        <div class="card">
          <h2>Your investment</h2>
          <div class="terms-row"><span class="lbl">Principal</span><span class="val">${fmtMoney(inv.principal)}</span></div>
          <div class="terms-row"><span class="lbl">Interest rate</span><span class="val">${escape(inv.rate||'—')}</span></div>
          <div class="terms-row"><span class="lbl">Term</span><span class="val">${inv.termMonths ? escape(String(inv.termMonths)) + ' months' : '—'}</span></div>
          <div class="terms-row"><span class="lbl">Status</span><span class="val"><span style="color:#9FD6A8">● Active</span></span></div>
        </div>
      `;
    }

    // Your documents (uploads + shared files)
    html += `<div class="card">
      <h2>Your documents</h2>
      <p class="lead">Documents we share with you appear here. You can also upload anything we request — accreditation letter, ID, wire confirmation — saved straight to your folder.</p>
      <form id="uploadForm">
        <label class="upload-zone" id="uploadZone" for="uploadInput">
          <div class="upload-icon">↑</div>
          <div class="upload-title">Drop files or click to upload</div>
          <div class="upload-sub">PDF, JPG, PNG · up to 25 MB per file</div>
        </label>
        <input type="file" id="uploadInput" name="file" style="display:none">
      </form>
      <div class="err" id="upErr"></div>
      <ul class="doc-list" id="docList"></ul>
    </div>`;

    // Deal updates (populated async).
    html += `<div id="updatesSection"></div>`;

    // Messages with Kevin (populated async).
    html += `<div id="messagesSection"></div>`;

    $body.innerHTML = html;

    wireUpload(inv);
    renderDocList(files);
    loadUpdates();
    loadMessages();
  }

  async function loadUpdates() {
    const host = document.getElementById('updatesSection');
    if (!host) return;
    try {
      const r = await fetchWithTimeout('/api/portal/updates', {}, 9000);
      if (!r.ok) return;
      const d = await r.json();
      const updates = (d && d.updates) || [];
      if (!updates.length) { host.innerHTML = ''; return; }
      host.innerHTML = `<div class="card">
        <h2>Updates</h2>
        <p class="lead">The latest from Kevin on The Avenue.</p>
        ${updates.map(u => `
          <div style="padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.08)">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
              <div style="color:white;font-weight:600">${escape(u.title || 'Update')}</div>
              <div style="color:var(--muted);font-size:12px;white-space:nowrap">${fmtDate(u.createdAt)}</div>
            </div>
            ${u.body ? `<div style="color:var(--text);font-size:14px;margin-top:6px;white-space:pre-wrap">${escape(u.body)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    } catch (err) { console.warn('updates load failed:', err); }
  }

  async function loadMessages() {
    const host = document.getElementById('messagesSection');
    if (!host) return;
    try {
      const r = await fetchWithTimeout('/api/portal/messages', {}, 9000);
      if (!r.ok) return;
      const d = await r.json();
      const messages = (d && d.messages) || [];
      host.innerHTML = `<div class="card">
        <h2>Messages</h2>
        <p class="lead">Questions for Kevin? Send a message — he'll reply here and by email.</p>
        <div id="msgThread" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">${renderMsgThread(messages)}</div>
        <form id="msgForm" style="display:flex;gap:10px;align-items:flex-end">
          <textarea id="msgInput" rows="2" placeholder="Write a message…" style="flex:1;padding:11px 13px;background:var(--input-bg);border:1px solid var(--hairline);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical"></textarea>
          <button type="submit" class="sign-btn" id="msgSend" style="width:auto;padding:12px 20px;margin:0">Send</button>
        </form>
        <div class="err" id="msgErr"></div>
      </div>`;
      wireMessageForm();
    } catch (err) { console.warn('messages load failed:', err); }
  }

  function renderMsgThread(messages) {
    if (!messages.length) return '<div style="color:var(--muted);font-style:italic;font-size:13px">No messages yet. Start the conversation below.</div>';
    return messages.map(m => {
      const mine = m.from === 'investor';
      const align = mine ? 'flex-end' : 'flex-start';
      const bg = mine ? 'rgba(212,162,74,0.16)' : 'rgba(255,255,255,0.06)';
      const who = mine ? 'You' : 'Kevin';
      return `<div style="align-self:${align};max-width:80%">
        <div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-align:${mine?'right':'left'}">${who} · ${fmtDate(m.createdAt)}</div>
        <div style="background:${bg};border:1px solid var(--hairline);border-radius:12px;padding:10px 13px;font-size:14px;white-space:pre-wrap">${escape(m.body)}</div>
      </div>`;
    }).join('');
  }

  function wireMessageForm() {
    const form = document.getElementById('msgForm');
    const input = document.getElementById('msgInput');
    const errEl = document.getElementById('msgErr');
    const btn = document.getElementById('msgSend');
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = (input.value || '').trim();
      errEl.textContent = '';
      if (!body) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/portal/messages', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        const data = await res.json();
        if (data.ok) { input.value = ''; loadMessages(); }
        else errEl.textContent = data.message || 'Could not send.';
      } catch { errEl.textContent = 'Network error. Try again.'; }
      finally { btn.disabled = false; btn.textContent = 'Send'; }
    });
  }

  function firstName(n){ return (n||'').split(' ')[0]; }


  function wireUpload(inv) {
    const zone = document.getElementById('uploadZone');
    const input = document.getElementById('uploadInput');
    const errEl = document.getElementById('upErr');
    input.addEventListener('change', () => doUpload(input.files));
    ;['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
    ;['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
    zone.addEventListener('drop', e => { e.preventDefault(); doUpload(e.dataTransfer.files); });

    async function doUpload(files) {
      errEl.textContent = '';
      if (!files || !files.length) return;
      for (const f of files) {
        const fd = new FormData();
        fd.append('file', f);
        try {
          const res = await fetch('/api/portal/upload', { method:'POST', body: fd });
          const data = await res.json();
          if (!data.ok) { errEl.textContent = data.message || 'Upload failed.'; return; }
        } catch (err) { errEl.textContent = 'Network error.'; return; }
      }
      load(); // reload to refresh file list
    }
  }

  function renderDocList(files) {
    const list = document.getElementById('docList');
    if (!list) return;
    if (!files.length) { list.innerHTML = '<li style="color:var(--muted);font-style:italic;justify-content:center">No documents yet.</li>'; return; }
    list.innerHTML = files.map(f => {
      const ext = fileExt(f.name);
      return `<li>
        <span class="doc-tag">${escape(ext||'FILE')}</span>
        <div class="doc-info">
          <a class="doc-name" href="${escape(f.url)}" target="_blank" rel="noopener">${escape(f.name)}</a>
          <div class="doc-meta">${fmtDate(f.createdTime)}</div>
        </div>
      </li>`;
    }).join('');
  }

  load();
</script>
</body>
</html>
