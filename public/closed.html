<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Avenue · Fountain Hills</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--cream:#F5EFE6;--ink:#1A1816;--text:rgba(255,255,255,0.92)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;font-family:'Inter',-apple-system,sans-serif;color:var(--text);background:var(--teal-deep)}
  .closed{
    position:relative;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:48px 24px;
    background-image:
      linear-gradient(to bottom, rgba(15,38,42,0.45) 0%, rgba(15,38,42,0.62) 55%, rgba(31,74,82,0.97) 100%),
      url('/hero-rendering.jpg');
    background-size:cover;background-position:center 32%;background-repeat:no-repeat;
    text-shadow:0 2px 16px rgba(0,0,0,0.45);
  }
  .brand-mark{margin-bottom:34px}
  .brand-name{font-family:'Cormorant Garamond',serif;font-size:30px;color:#fff;letter-spacing:0.01em;line-height:1}
  .brand-sub{font-size:12px;letter-spacing:0.32em;text-transform:uppercase;color:#E5C385;margin-top:8px}
  .eyebrow{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;font-weight:500}
  h1{font-family:'Cormorant Garamond',serif;font-size:54px;line-height:1.05;color:#fff;margin:0 0 18px;font-weight:600;letter-spacing:-0.01em}
  p.lead{font-size:17px;color:rgba(255,255,255,0.88);max-width:520px;margin:0 auto 8px;line-height:1.55}
  p.sub{font-size:14px;color:rgba(255,255,255,0.7);max-width:520px;margin:0 auto}
  .login-link{
    display:inline-flex;align-items:center;gap:7px;margin-top:40px;
    padding:12px 22px;border:1px solid rgba(212,162,74,0.6);border-radius:10px;
    color:var(--gold);font-size:13px;font-weight:500;text-decoration:none;
    background:rgba(0,0,0,0.25);backdrop-filter:blur(4px);transition:background .2s,color .2s,transform .2s;
  }
  .login-link:hover{background:var(--gold);color:var(--ink);transform:translateY(-1px)}
  .footer{position:absolute;bottom:24px;left:0;right:0;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.45)}
  @media (max-width:600px){
    h1{font-size:38px}
    p.lead{font-size:15px}
    .brand-name{font-size:26px}
  }
</style>
</head>
<body>
  <main class="closed">
    <div class="brand-mark">
      <div class="brand-name">The Avenue</div>
      <div class="brand-sub">Fountain Hills</div>
    </div>
    <div class="eyebrow">Investor Opportunity</div>
    <h1>This deal is closed.</h1>
    <p class="lead">Thank you for your interest in The Avenue at Fountain Hills. This offering is fully subscribed.</p>
    <p class="sub">Stay tuned — we'll be sharing what's next soon.</p>
    <a class="login-link" href="/portal/sign-in">
      Investor login
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <div class="footer">Confidential · By Invitation Only</div>
  </main>
</body>
</html>
