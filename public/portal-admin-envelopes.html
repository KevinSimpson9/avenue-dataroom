<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envelopes · The Avenue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);--hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.30)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .admin-pill{background:rgba(212,162,74,0.18);color:var(--gold);border:1px solid rgba(212,162,74,0.45);padding:4px 10px;border-radius:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-left:8px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .breadcrumb{padding:14px 32px;border-bottom:1px solid var(--hairline);font-size:13px;background:rgba(0,0,0,0.18)}
  .breadcrumb a{text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .breadcrumb .sep{color:var(--muted);margin:0 8px}
  .body{max-width:1100px;margin:0 auto;padding:32px 32px 80px}
  h1{font-family:'Cormorant Garamond',serif;font-size:30px;color:white;margin:0 0 6px}
  .h1-sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .card{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:14px;padding:20px;margin-bottom:20px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .card-head h2{font-family:'Cormorant Garamond',serif;font-size:20px;color:white;margin:0}
  .new-btn{background:var(--gold);color:var(--ink);border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none}
  .new-btn:hover{background:var(--gold-hover);color:white}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--hairline);font-weight:500}
  td{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,0.06);vertical-align:top}
  tr:hover{background:rgba(255,255,255,0.03)}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500}
  .badge.draft{background:rgba(255,255,255,0.06);color:var(--muted)}
  .badge.sent{background:rgba(212,162,74,0.16);color:var(--gold)}
  .badge.partial{background:rgba(255,215,138,0.12);color:#F0C56F}
  .badge.executed{background:rgba(159,214,168,0.14);color:#9FD6A8}
  .badge.voided{background:rgba(255,154,154,0.10);color:#ff9a9a}
  .r-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,0.20);border:1px solid var(--hairline);padding:2px 8px;border-radius:12px;font-size:11px;margin:2px 4px 2px 0}
  .r-chip.signed{border-color:rgba(159,214,168,0.4);color:#9FD6A8}
  .r-chip .check{font-size:10px}
  .row-btn{background:rgba(255,255,255,0.06);border:1px solid var(--hairline);color:var(--text);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;margin-right:4px;white-space:nowrap;font-family:inherit}
  .row-btn:hover{border-color:var(--gold);color:var(--gold)}
  .row-btn:disabled{opacity:.45;cursor:wait}
  .row-btn.danger:hover:not(:disabled){border-color:#ff9a9a;color:#ff9a9a;background:rgba(255,154,154,0.06)}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;background:rgba(0,0,0,0.12);border:1px dashed var(--hairline);border-radius:12px}

  @media (max-width:720px){
    .header{padding:14px 16px}
    .brand{font-size:18px}
    .brand-tag{display:none}
    .breadcrumb{padding:12px 14px}
    .body{padding:22px 14px 60px}
    h1{font-size:24px}
    .card{padding:16px 14px}
    .card-head{flex-direction:column;align-items:stretch;gap:10px}
    .new-btn{text-align:center;padding:11px 14px}

    table,thead,tbody,tr,td,th{display:block;width:auto}
    thead{display:none}
    tr{background:rgba(0,0,0,0.22);border:1px solid var(--hairline);border-radius:12px;padding:14px;margin-bottom:10px}
    tr:hover{background:rgba(0,0,0,0.22)}
    td{padding:0;border-bottom:0}
    td + td{margin-top:10px}
    td:last-child{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
    td:last-child .row-btn{flex:1;margin-right:0;text-align:center}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · Investor Portal</span><span class="admin-pill">Admin</span></div>
    <a href="/api/portal/logout" class="signout">Sign out</a>
  </div>
  <div class="breadcrumb">
    <a href="/portal/admin">Admin</a><span class="sep">/</span>
    <span style="color:white">Envelopes</span>
  </div>
  <div class="body" id="body">
    <div class="empty">Loading…</div>
  </div>
<script>
  function escapeHtml(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}
  function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }

  async function load() {
    let data;
    try {
      const r = await fetch('/api/portal/envelopes');
      if (r.status === 401) { window.location.href = '/'; return; }
      data = await r.json();
    } catch (err) {
      document.getElementById('body').innerHTML = '<div class="empty" style="color:#ff9a9a">Could not load envelopes.</div>';
      return;
    }
    render(data.envelopes || []);
  }

  function render(envelopes) {
    const body = document.getElementById('body');
    let html = `
      <h1>Document signing</h1>
      <p class="h1-sub">Send any PDF for signature. Each envelope is independent — fields and recipients are configured per document.</p>
      <div class="card">
        <div class="card-head">
          <h2>All envelopes</h2>
          <a class="new-btn" href="/portal/admin/envelope">+ New envelope</a>
        </div>
    `;
    if (!envelopes.length) {
      html += '<div class="empty">No envelopes yet. Click "+ New envelope" to send your first document.</div>';
    } else {
      html += `
        <table>
          <thead><tr>
            <th style="width:30%">Title</th>
            <th>Recipients</th>
            <th style="width:130px">Status</th>
            <th style="width:120px">Created</th>
            <th style="width:160px">Actions</th>
          </tr></thead>
          <tbody>${envelopes.map(rowHtml).join('')}</tbody>
        </table>
      `;
    }
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => handleAction(el.dataset.act, el.dataset.id, el)));
  }

  function rowHtml(env) {
    const statusBadge = badge(env.status);
    const recipients = (env.recipients || []).map(r => `
      <span class="r-chip ${r.signedAt ? 'signed' : ''}">
        ${r.signedAt ? '<span class="check">✓</span>' : ''}${escapeHtml(r.name || r.email)}
      </span>
    `).join('');
    const actions = [];
    if (env.status === 'draft') {
      actions.push('<button class="row-btn" data-act="open" data-id="' + escapeHtml(env.id) + '">Edit</button>');
    } else if (env.status === 'executed') {
      actions.push('<button class="row-btn" data-act="open" data-id="' + escapeHtml(env.id) + '">View</button>');
    } else {
      actions.push('<button class="row-btn" data-act="open" data-id="' + escapeHtml(env.id) + '">View</button>');
    }
    if (env.status === 'sent' || env.status === 'partially-signed') {
      actions.push('<button class="row-btn danger" data-act="void" data-id="' + escapeHtml(env.id) + '">Void</button>');
    }
    return `
      <tr>
        <td>
          <div style="color:white;font-weight:500">${escapeHtml(env.title)}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">${escapeHtml(env.sourcePdfName || '')}</div>
          ${env.enforceOrder ? '<div style="color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;margin-top:4px">Sequential</div>' : ''}
        </td>
        <td>${recipients || '<span style="color:var(--muted);font-style:italic">No recipients</span>'}</td>
        <td>${statusBadge}</td>
        <td style="color:var(--muted);font-size:12px">${fmtDate(env.createdAt)}</td>
        <td>${actions.join(' ')}</td>
      </tr>
    `;
  }

  function badge(status) {
    const map = {
      'draft': '<span class="badge draft">Draft</span>',
      'sent': '<span class="badge sent">Sent</span>',
      'partially-signed': '<span class="badge partial">Partially signed</span>',
      'executed': '<span class="badge executed">✓ Executed</span>',
      'voided': '<span class="badge voided">Voided</span>'
    };
    return map[status] || '<span class="badge draft">' + escapeHtml(status) + '</span>';
  }

  async function handleAction(act, id, btn) {
    if (act === 'open') { window.location.href = '/portal/admin/envelope?id=' + encodeURIComponent(id); return; }
    if (act === 'void') {
      if (!confirm('Void this envelope? Signers will no longer be able to use their links.')) return;
      if (btn) btn.disabled = true;
      try {
        const r = await fetch('/api/portal/envelopes/void', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
        const d = await r.json();
        if (!d.ok) { alert(d.message || 'Could not void.'); if (btn) btn.disabled = false; return; }
        load();
      } catch (err) {
        alert('Network error: ' + err.message);
        if (btn) btn.disabled = false;
      }
    }
  }
  load();
</script>
</body>
</html>
