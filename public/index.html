<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Avenue · Fountain Hills</title>
<meta name="description" content="The Avenue at Fountain Hills.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta property="og:title" content="The Avenue at Fountain Hills">
<meta property="og:description" content="The Avenue at Fountain Hills.">
<meta property="og:image" content="https://dataroom.theavenuefh.com/og-image.png">
<meta property="og:url" content="https://dataroom.theavenuefh.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dataroom.theavenuefh.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <a href="/portal/sign-in" class="investor-login-corner">
      Investor login
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <div class="brand-mark">
      <div class="brand-name">The Avenue</div>
      <div class="brand-sub">Fountain Hills</div>
    </div>

    <div class="lock-circle">
      <svg class="lock-icon" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>

    <h1 class="gate-title">The Avenue</h1>
    <p class="gate-subtitle">Enter the access password to continue</p>

    <form id="gateForm">
      <div class="password-wrap">
        <svg class="password-icon" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <input type="password" name="password" class="password-input" id="passwordInput" placeholder="Access password" autocomplete="off" required style="padding-right:48px">
        <button type="button" id="passwordToggle" aria-label="Show password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,0.5);padding:6px;display:inline-flex;align-items:center;justify-content:center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="unlock-btn" id="unlockBtn">Continue</button>
    </form>

    <div class="nda-card">
      <p class="nda-text">This offering is closed to new investors. Existing investors can access their documents and updates through the <a href="/portal/sign-in" style="color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.4)">investor portal</a>.</p>
    </div>

    <div class="gate-footer">Confidential · By Invitation Only</div>
  </div>
</div>

<script>
  // --- Show/hide password ---
  document.getElementById('passwordToggle').addEventListener('click', () => {
    const input = document.getElementById('passwordInput');
    const btn = document.getElementById('passwordToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    btn.innerHTML = showing
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  });

  // --- Password gate ---
  document.getElementById('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('unlockBtn');
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('errorMsg');
    btn.textContent = 'Verifying...';
    btn.disabled = true;
    error.textContent = '';

    try {
      const res = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value })
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = '/room';
      } else {
        error.textContent = data.message || 'Incorrect password.';
        input.value = '';
        input.focus();
      }
    } catch (err) {
      error.textContent = 'Unable to verify. Please try again.';
    } finally {
      btn.textContent = 'Continue';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
