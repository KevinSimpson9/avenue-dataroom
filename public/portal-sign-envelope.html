<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review and sign · The Avenue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4A24A;--gold-hover:#BC8E3C;--teal-deep:#1F4A52;--cream:#F5EFE6;--ink:#1A1816;--muted:rgba(255,255,255,0.7);--text:rgba(255,255,255,0.92);--hairline:rgba(255,255,255,0.12);--input-bg:rgba(0,0,0,0.25);--bg-soft:rgba(0,0,0,0.18)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--teal-deep);font-family:'Inter',-apple-system,sans-serif;color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .header{border-bottom:1px solid var(--hairline);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.30)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:white}
  .brand-tag{opacity:.5;font-size:13px;margin-left:8px}
  .signout{color:var(--gold);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(212,162,74,0.3)}
  .body{max-width:1000px;margin:0 auto;padding:24px 24px 80px}
  .hero{margin-bottom:18px}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:28px;color:white;margin:0 0 4px;font-weight:600}
  .hero .sub{color:var(--muted);font-size:13px}
  .banner{background:rgba(212,162,74,0.10);border:1px solid rgba(212,162,74,0.4);border-radius:12px;padding:14px 18px;margin-bottom:18px;font-size:13px;color:var(--cream)}
  .banner.signed{background:rgba(159,214,168,0.14);border-color:rgba(159,214,168,0.4);color:#9FD6A8}
  .banner.err{background:rgba(255,154,154,0.10);border-color:rgba(255,154,154,0.4);color:#ff9a9a}

  .page-wrap{position:relative;margin:0 auto 18px;background:white;box-shadow:0 4px 22px rgba(0,0,0,0.4);max-width:100%}
  .page-wrap canvas{display:block;max-width:100%;height:auto}
  .page-num{position:absolute;top:-22px;left:0;font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase}

  .fld{position:absolute;border:2px solid #2563eb;background:rgba(37,99,235,0.10);border-radius:4px;padding:0;display:flex;align-items:center;justify-content:flex-start;color:#1A1816;overflow:hidden}
  .fld input,.fld textarea{width:100%;height:100%;border:0;background:transparent;color:#1A1816;font-family:'Inter',sans-serif;font-size:13px;padding:2px 4px;resize:none}
  .fld input.sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#000073}
  .fld.locked{border:1.5px dashed rgba(0,0,0,0.4);background:rgba(0,0,0,0.04);color:#888;font-size:10px;padding:2px 4px;letter-spacing:0.04em;cursor:not-allowed;font-weight:600;text-transform:uppercase}
  .fld.locked.filled{background:rgba(159,214,168,0.18);border-style:solid;border-color:#9FD6A8;color:#0a5d18;text-transform:none;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:0}
  .fld.filled-by-me{background:rgba(159,214,168,0.18);border-color:#9FD6A8}

  .sticky-bar{position:sticky;bottom:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);border-top:1px solid var(--hairline);padding:14px 24px;margin:24px -24px -80px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:50}
  .sticky-bar .progress{color:var(--muted);font-size:13px}
  .agree{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px;max-width:540px;line-height:1.5}
  .agree input{margin-top:3px}
  .sign-btn{padding:13px 26px;background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
  .sign-btn:disabled{opacity:0.5;cursor:not-allowed}
  .sign-btn:hover:not(:disabled){background:var(--gold-hover);color:white}
  .err{color:#ff9a9a;font-size:13px;margin-top:8px}
  .done{padding:80px 24px;text-align:center}
  .done h2{font-family:'Cormorant Garamond',serif;font-size:32px;color:white;margin:0 0 12px}

  @media (max-width:720px){
    .header{padding:14px 16px}
    .brand{font-size:18px}
    .brand-tag{display:none}
    .body{padding:18px 14px 100px}
    .hero h1{font-size:22px}
    .hero .sub{font-size:12px}
    .banner{padding:12px 14px;font-size:12px;border-radius:10px}
    .page-num{top:-18px;font-size:10px}
    .sticky-bar{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px;margin:20px -14px -100px}
    .sticky-bar > div{width:100%}
    .agree{font-size:11px;max-width:none}
    .sign-btn{width:100%;padding:14px}
    .done{padding:60px 18px}
    .done h2{font-size:24px}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">The Avenue<span class="brand-tag"> · e-Signature</span></div>
    <span id="signedAs" style="font-size:13px;color:var(--muted)"></span>
  </div>
  <div class="body" id="body">
    <div style="padding:80px 20px;text-align:center;color:var(--muted)">Loading document…</div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const params = new URLSearchParams(window.location.search);
  const envelopeId = params.get('id') || '';
  const token = params.get('token') || '';

  const state = {
    envelope: null,
    viewerRecipientId: null,
    pageDims: [],
    values: {} // fieldId -> string
  };

  function escapeHtml(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}

  async function init() {
    if (!envelopeId) { showError('Missing envelope id.'); return; }
    try {
      const url = '/api/portal/envelopes/get?id=' + encodeURIComponent(envelopeId) + (token ? '&token=' + encodeURIComponent(token) : '');
      const r = await fetch(url);
      if (r.status === 401 || r.status === 404) {
        showError('This link is invalid or has expired. Ask the sender to resend.');
        return;
      }
      const d = await r.json();
      if (!d.ok) { showError(d.message || 'Could not load envelope.'); return; }
      state.envelope = d.envelope;
      state.viewerRecipientId = d.viewerRecipientId || null;
      render();
      renderPdf();
    } catch (err) {
      showError('Network error: ' + err.message);
    }
  }

  function render() {
    const env = state.envelope;
    const me = (env.recipients || []).find(r => r.id === state.viewerRecipientId);

    // Check "already signed" before "voided" so a recipient who finished their
    // part sees the helpful message rather than a confusing void notice.
    if (me && me.signedAt) {
      document.getElementById('body').innerHTML = `
        <div class="done">
          <h2>You've already signed this document.</h2>
          <p style="color:var(--muted)">Waiting for the remaining recipients. We'll email you the fully-executed copy when everyone has signed.</p>
          <p style="margin-top:24px"><a href="/portal" style="color:var(--gold);text-decoration:underline">Back to portal</a></p>
        </div>`;
      return;
    }
    if (env.status === 'voided') { showError('This envelope has been voided by the sender.'); return; }
    if (env.status === 'executed') {
      document.getElementById('body').innerHTML = `
        <div class="done">
          <h2>This document is fully executed.</h2>
          <p style="color:var(--muted)">All signatures are on file. A copy was emailed to every recipient.</p>
          <p style="margin-top:24px"><a href="/portal" style="color:var(--gold);text-decoration:underline">Back to portal</a></p>
        </div>`;
      return;
    }
    if (env.enforceOrder && me) {
      const earlierUnsigned = (env.recipients || []).some(r => r.id !== me.id && (r.order || 0) < (me.order || 0) && !r.signedAt);
      if (earlierUnsigned) {
        document.getElementById('body').innerHTML = `
          <div class="done">
            <h2>Not your turn yet.</h2>
            <p style="color:var(--muted)">This envelope requires sequential signing. We'll email you the moment it's your turn.</p>
          </div>`;
        return;
      }
    }

    document.getElementById('signedAs').textContent = me ? 'Signing as ' + me.name + (me.role ? ' · ' + me.role : '') : '';
    document.getElementById('body').innerHTML = `
      <div class="hero">
        <h1>${escapeHtml(env.title || 'Document')}</h1>
        <div class="sub">${escapeHtml(env.sourcePdfName || '')}${me ? ' · You sign as <strong style="color:white">' + escapeHtml(me.role || me.name) + '</strong>' : ''}</div>
      </div>
      <div class="banner">Fill every field highlighted in blue, then check the agreement at the bottom and click <strong>Adopt and sign</strong>.</div>
      <div id="viewer"></div>
      <div class="sticky-bar">
        <div>
          <div class="progress" id="progress">0 of 0 fields filled</div>
          <label class="agree" style="margin-top:8px">
            <input type="checkbox" id="agreeBox">
            <span>I agree that typing my information above constitutes my legal electronic signature on this document under UETA / E-SIGN Act.</span>
          </label>
        </div>
        <button class="sign-btn" id="signBtn" disabled>Adopt and sign</button>
      </div>
    `;
    document.getElementById('agreeBox').addEventListener('change', updateProgress);
    document.getElementById('signBtn').addEventListener('click', submit);
  }

  async function renderPdf() {
    const viewer = document.getElementById('viewer');
    viewer.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Rendering PDF…</div>';
    try {
      const url = '/api/portal/envelopes/pdf?id=' + encodeURIComponent(envelopeId) + (token ? '&token=' + encodeURIComponent(token) : '');
      const buf = await (await fetch(url)).arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      state.pageDims = [];
      viewer.innerHTML = '';
      const containerWidth = Math.min(viewer.clientWidth, 920);
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const unscaled = page.getViewport({ scale: 1 });
        const scale = containerWidth / unscaled.width;
        const viewport = page.getViewport({ scale });
        state.pageDims.push({ widthPt: unscaled.width, heightPt: unscaled.height, renderScale: scale });
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';
        wrap.dataset.page = String(p);
        wrap.style.width = viewport.width + 'px';
        wrap.style.height = viewport.height + 'px';
        const num = document.createElement('div'); num.className = 'page-num'; num.textContent = 'Page ' + p;
        wrap.appendChild(num);
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        wrap.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        viewer.appendChild(wrap);
      }
      renderFields();
      updateProgress();
    } catch (err) {
      viewer.innerHTML = '<div class="banner err">Could not load PDF: ' + escapeHtml(err.message) + '</div>';
    }
  }

  function renderFields() {
    const myId = state.viewerRecipientId;
    for (const f of (state.envelope.fields || [])) {
      const wrap = document.querySelector('.page-wrap[data-page="' + f.page + '"]');
      if (!wrap) continue;
      const dims = state.pageDims[f.page - 1];
      if (!dims) continue;
      const xCanvas = f.x * dims.renderScale;
      const wCanvas = f.width * dims.renderScale;
      const hCanvas = f.height * dims.renderScale;
      const yCanvas = (dims.heightPt - f.y - f.height) * dims.renderScale;
      const fld = document.createElement('div');
      fld.className = 'fld';
      fld.style.left = xCanvas + 'px';
      fld.style.top = yCanvas + 'px';
      fld.style.width = wCanvas + 'px';
      fld.style.height = hCanvas + 'px';

      const recipient = (state.envelope.recipients || []).find(r => r.id === f.recipientId);
      const isMine = f.recipientId === myId;

      if (!isMine) {
        // Locked field for someone else. Show their value if already filled.
        fld.classList.add('locked');
        if (f.filledValue) { fld.classList.add('filled'); fld.textContent = f.filledValue; }
        else fld.textContent = (recipient ? recipient.name.split(' ')[0] : 'Other') + ' · ' + f.type;
      } else if (f.type === 'date') {
        fld.classList.add('locked', 'filled');
        fld.textContent = todayLong();
      } else {
        fld.classList.add('filled-by-me');
        if (f.type === 'signature' || f.type === 'initials') {
          const input = document.createElement('input');
          input.type = 'text';
          if (f.type === 'signature') input.className = 'sig';
          input.placeholder = f.type === 'signature' ? ((recipient && recipient.name) || 'Type your name') : 'AB';
          input.dataset.fid = f.id;
          input.addEventListener('input', e => { state.values[f.id] = e.target.value; updateProgress(); });
          fld.appendChild(input);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Type here';
          input.dataset.fid = f.id;
          input.addEventListener('input', e => { state.values[f.id] = e.target.value; updateProgress(); });
          fld.appendChild(input);
        }
      }
      wrap.appendChild(fld);
    }
  }

  function todayLong() {
    return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function updateProgress() {
    const myFields = (state.envelope.fields || []).filter(f => f.recipientId === state.viewerRecipientId);
    const inputs = myFields.filter(f => f.type !== 'date'); // date auto-filled
    const filled = inputs.filter(f => (state.values[f.id] || '').trim().length > 0).length;
    const total = inputs.length;
    const progressEl = document.getElementById('progress');
    if (progressEl) progressEl.textContent = filled + ' of ' + total + ' field' + (total === 1 ? '' : 's') + ' filled';
    const agreed = document.getElementById('agreeBox') && document.getElementById('agreeBox').checked;
    const btn = document.getElementById('signBtn');
    if (btn) btn.disabled = !(filled === total && agreed);
  }

  async function submit() {
    const btn = document.getElementById('signBtn');
    btn.disabled = true; btn.textContent = 'Signing…';
    try {
      const myFields = (state.envelope.fields || []).filter(f => f.recipientId === state.viewerRecipientId && f.type !== 'date');
      const body = {
        id: state.envelope.id,
        token,
        fields: myFields.map(f => ({ id: f.id, value: state.values[f.id] || '' }))
      };
      const r = await fetch('/api/portal/envelopes/sign', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!d.ok) { showInline(d.message || 'Could not sign.'); btn.disabled = false; btn.textContent = 'Adopt and sign'; return; }
      document.getElementById('body').innerHTML = `
        <div class="done">
          <h2>${d.allSigned ? 'Document fully executed.' : 'You’re done. Thank you.'}</h2>
          <p style="color:var(--muted)">${d.allSigned
            ? 'All signers have completed this envelope. A fully-executed copy has been emailed to everyone.'
            : 'Your signature is on file. We’ll email you the fully-executed copy once the remaining recipients have signed.'}</p>
          <p style="margin-top:28px"><a href="/portal" style="color:var(--gold);text-decoration:underline">Back to portal</a></p>
        </div>`;
    } catch (err) {
      showInline('Network error: ' + err.message);
      btn.disabled = false; btn.textContent = 'Adopt and sign';
    }
  }

  function showError(msg) {
    document.getElementById('body').innerHTML = `<div class="banner err">${escapeHtml(msg)}</div><p style="text-align:center;margin-top:30px"><a href="/portal" style="color:var(--gold)">Back to portal</a></p>`;
  }
  function showInline(msg) {
    const bar = document.querySelector('.sticky-bar');
    let err = document.querySelector('.sticky-bar .err');
    if (!err) { err = document.createElement('div'); err.className = 'err'; bar.appendChild(err); }
    err.textContent = msg;
  }

  init();
})();
</script>
</body>
</html>
